SYMBOLS {
    NES_PRG_BANKS: type = weak, value = 2;
    NES_CHR_BANKS: type = weak, value = 1;
    NES_MAPPER:    type = weak, value = 0;
    NES_MIRRORING: type = weak, value = 0;
    __STACKSIZE__: type = weak, value = $0300;
}
MEMORY {
    ZP:   start = $0002, size = $00BE, type = rw, define = yes, file = "";
    OAM:  start = $0200, size = $0100, type = rw, define = yes, file = "";
    RAM:  start = $0300, size = $0200, type = rw, define = yes, file = "";
    STK:  start = $0500, size = $0300, type = rw, define = yes, file = "";
    HDR:  start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG:  start = $8000, size = $7FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    VEC:  start = $FFFA, size = $0006, type = ro, file = %O, fill = yes;
    CHR:  start = $0000, size = $2000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,            type = zp,  define = yes;
    OAM:      load = OAM,           type = bss, define = yes, optional = yes;
    BSS:      load = RAM,           type = bss, define = yes;
    HEADER:   load = HDR,           type = ro;
    STARTUP:  load = PRG,           type = ro,  define = yes;
    LOWCODE:  load = PRG,           type = ro,  optional = yes;
    INIT:     load = PRG,           type = ro,  optional = yes;
    ONCE:     load = PRG,           type = ro,  optional = yes;
    CODE:     load = PRG,           type = ro,  define = yes;
    RODATA:   load = PRG,           type = ro,  define = yes;
    DATA:     load = PRG, run = RAM, type = rw,  define = yes;
    VECTORS:  load = VEC,           type = ro;
    CHARS:    load = CHR,           type = ro,  optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
