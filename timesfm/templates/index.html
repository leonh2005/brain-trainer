<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimesFM 台股預測</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 2rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: 1.5rem;
    letter-spacing: -0.02em;
  }
  h1 span { color: #4f9cf9; }

  .controls {
    display: flex;
    gap: 0.75rem;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .field { display: flex; flex-direction: column; gap: 0.35rem; }
  label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  input {
    background: #1c1f2e;
    border: 1px solid #2d3148;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 1rem;
    padding: 0.55rem 0.9rem;
    outline: none;
    width: 120px;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #4f9cf9; }
  button {
    background: #4f9cf9;
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.6rem 1.4rem;
    transition: background 0.15s, opacity 0.15s;
  }
  button:hover { background: #3a88e8; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  #status-bar {
    font-size: 0.8rem;
    color: #f0a500;
    margin-bottom: 1rem;
    min-height: 1.2rem;
  }
  #status-bar.ready { color: #4caf50; }
  #status-bar.error { color: #f44336; }

  .stats {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .stat-card {
    background: #1c1f2e;
    border: 1px solid #2d3148;
    border-radius: 10px;
    padding: 0.9rem 1.2rem;
    min-width: 130px;
  }
  .stat-card .label { font-size: 0.72rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .value { font-size: 1.4rem; font-weight: 700; color: #fff; margin-top: 0.2rem; }
  .stat-card .value.up { color: #4caf50; }
  .stat-card .value.down { color: #f44336; }

  .chart-wrap {
    background: #1c1f2e;
    border: 1px solid #2d3148;
    border-radius: 12px;
    padding: 1.2rem;
    position: relative;
  }
  canvas { max-height: 380px; }

  #loading {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15,17,23,0.7);
    border-radius: 12px;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    color: #aaa;
  }
  #loading.show { display: flex; }
</style>
</head>
<body>

<h1>TimesFM <span>台股預測</span></h1>

<div id="status-bar">⏳ 模型載入中...</div>

<div class="controls">
  <div class="field">
    <label>股票代號</label>
    <input id="symbol" type="text" value="2330" placeholder="2330">
  </div>
  <div class="field">
    <label>預測天數</label>
    <input id="horizon" type="number" value="10" min="1" max="30">
  </div>
  <button id="btn" onclick="runForecast()" disabled>預測</button>
</div>

<div class="stats" id="stats" style="display:none">
  <div class="stat-card">
    <div class="label">最新收盤</div>
    <div class="value" id="s-last">—</div>
  </div>
  <div class="stat-card">
    <div class="label">預測終值</div>
    <div class="value" id="s-pred">—</div>
  </div>
  <div class="stat-card">
    <div class="label">預測漲跌</div>
    <div class="value" id="s-chg">—</div>
  </div>
  <div class="stat-card">
    <div class="label">趨勢判斷</div>
    <div class="value" id="s-trend" style="font-size:1.1rem">—</div>
  </div>
</div>

<div class="chart-wrap">
  <canvas id="chart"></canvas>
  <div id="loading"><span>預測中...</span></div>
</div>

<script>
let chart = null;

async function pollStatus() {
  const bar = document.getElementById("status-bar");
  const btn = document.getElementById("btn");
  while (true) {
    try {
      const res = await fetch("/api/status");
      const data = await res.json();
      if (data.ready) {
        bar.textContent = "✅ 模型已就緒";
        bar.className = "ready";
        btn.disabled = false;
        return;
      }
      if (data.error) {
        bar.textContent = "❌ 模型載入失敗：" + data.error;
        bar.className = "error";
        return;
      }
    } catch {}
    await new Promise(r => setTimeout(r, 2000));
  }
}

async function runForecast() {
  const symbol = document.getElementById("symbol").value.trim() || "2330";
  const horizon = parseInt(document.getElementById("horizon").value) || 10;
  const loading = document.getElementById("loading");
  const btn = document.getElementById("btn");

  loading.classList.add("show");
  btn.disabled = true;

  try {
    const res = await fetch("/api/forecast", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbol, horizon }),
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || "預測失敗"); return; }
    renderChart(data);
    renderStats(data);
  } catch (e) {
    alert("請求失敗：" + e.message);
  } finally {
    loading.classList.remove("show");
    btn.disabled = false;
  }
}

function renderStats(data) {
  const chg = data.total_chg;
  document.getElementById("s-last").textContent = data.last_close.toFixed(2);
  document.getElementById("s-pred").textContent = data.pred_prices[data.pred_prices.length - 1].toFixed(2);
  const chgEl = document.getElementById("s-chg");
  chgEl.textContent = (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%";
  chgEl.className = "value " + (chg > 0 ? "up" : chg < 0 ? "down" : "");
  document.getElementById("s-trend").textContent = data.trend;
  document.getElementById("stats").style.display = "flex";
}

function renderChart(data) {
  const histDates = data.history_dates;
  const histPrices = data.history_prices;
  const predPrices = data.pred_prices;
  const q10 = data.q10;
  const q90 = data.q90;

  // 只顯示最近 60 筆歷史
  const showHist = 60;
  const slicedDates = histDates.slice(-showHist);
  const slicedPrices = histPrices.slice(-showHist);

  // 產生預測日期（工作日）
  const lastDate = new Date(slicedDates[slicedDates.length - 1]);
  const predDates = [];
  let d = new Date(lastDate);
  for (let i = 0; i < predPrices.length; i++) {
    do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
    predDates.push(d.toISOString().slice(0, 10));
  }

  const allLabels = [...slicedDates, ...predDates];
  const histData = [...slicedPrices, ...Array(predPrices.length).fill(null)];
  const predData = [...Array(slicedPrices.length - 1).fill(null), slicedPrices[slicedPrices.length - 1], ...predPrices];
  const q10Data = [...Array(slicedPrices.length - 1).fill(null), slicedPrices[slicedPrices.length - 1], ...q10];
  const q90Data = [...Array(slicedPrices.length - 1).fill(null), slicedPrices[slicedPrices.length - 1], ...q90];

  if (chart) chart.destroy();

  const ctx = document.getElementById("chart").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: allLabels,
      datasets: [
        {
          label: "歷史收盤",
          data: histData,
          borderColor: "#4f9cf9",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.3,
        },
        {
          label: "預測",
          data: predData,
          borderColor: "#f9c74f",
          borderWidth: 2,
          borderDash: [5, 3],
          pointRadius: 3,
          pointBackgroundColor: "#f9c74f",
          tension: 0.3,
        },
        {
          label: "90% 區間",
          data: q90Data,
          borderColor: "transparent",
          backgroundColor: "rgba(249,199,79,0.12)",
          fill: "+1",
          pointRadius: 0,
          tension: 0.3,
        },
        {
          label: "10% 區間",
          data: q10Data,
          borderColor: "transparent",
          backgroundColor: "rgba(249,199,79,0.12)",
          fill: false,
          pointRadius: 0,
          tension: 0.3,
        },
      ],
    },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          labels: { color: "#aaa", font: { size: 12 }, boxWidth: 20 },
          onClick: () => {},
        },
        tooltip: {
          backgroundColor: "#1c1f2e",
          borderColor: "#2d3148",
          borderWidth: 1,
          titleColor: "#aaa",
          bodyColor: "#fff",
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              return v !== null ? `${ctx.dataset.label}: ${v.toFixed(2)}` : null;
            }
          }
        },
      },
      scales: {
        x: {
          ticks: {
            color: "#666",
            maxTicksLimit: 10,
            maxRotation: 0,
          },
          grid: { color: "#1e2133" },
        },
        y: {
          ticks: { color: "#666" },
          grid: { color: "#1e2133" },
        },
      },
    },
  });
}

pollStatus();
</script>
</body>
</html>
