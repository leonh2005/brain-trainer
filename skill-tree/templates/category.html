<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>{{ category.name }} — SKILL REGISTRY</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="screen">

  <div class="page-header">
    <a class="back-link" href="/">← BACK TO REGISTRY</a>
    <div style="display:flex; align-items:baseline; gap:16px; margin-top:8px;">
      <div class="page-title" style="color: {{ category.color }}; text-shadow: 0 0 12px {{ category.color }}66;">
        {{ category.emoji }} {{ category.name }}
      </div>
      <button class="btn" style="font-size:9px; padding:4px 12px;" onclick="document.getElementById('cat-edit-form').style.display='block'; this.style.display='none'">EDIT</button>
      <form method="POST" action="/category/{{ category.id }}/delete" style="display:inline;" onsubmit="return confirm('確定刪除「{{ category.name }}」及底下所有技能？')">
        <button class="btn" type="submit" style="font-size:9px; padding:4px 12px; border-color:#ff4466; color:#ff4466;">DELETE</button>
      </form>
    </div>
  </div>

  <form id="cat-edit-form" class="xp-form" method="POST" action="/category/{{ category.id }}/edit" style="display:none; max-width:600px; margin:12px 32px;">
    <h3>編輯大類</h3>
    <div class="form-row">
      <label>名稱</label>
      <input type="text" name="name" value="{{ category.name }}" required>
    </div>
    <div class="form-row">
      <label>Emoji</label>
      <input type="text" name="emoji" value="{{ category.emoji }}" style="max-width:80px;">
    </div>
    <div class="form-row">
      <label>顏色</label>
      <input type="color" name="color" value="{{ category.color }}" style="max-width:80px; padding:2px;">
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn" type="submit">SAVE</button>
      <button class="btn" type="button" style="border-color:var(--text-dim); color:var(--text-dim);" onclick="document.getElementById('cat-edit-form').style.display='none'; document.querySelector('.btn[onclick*=cat-edit-form]').style.display='inline-block'">CANCEL</button>
    </div>
  </form>

  <div class="skills-list">
    {% for skill in skills %}
    <div class="skill-card-wrap {% if skill.parent_id %}child{% endif %}">
      <a class="skill-card"
         href="/skill/{{ skill.id }}"
         style="--bar-color: {{ category.color }}">
        <div class="skill-card-header">
          <span class="skill-card-name">{{ skill.name }}</span>
          <span class="skill-card-level" style="color: {{ category.color }}">LV {{ skill.level }}</span>
        </div>
        <div class="xp-bar-bg">
          <div class="xp-bar-fill"
               style="width: {{ skill.progress_pct }}%; --bar-color: {{ category.color }}"></div>
        </div>
      </a>
      <form method="POST" action="/skill/{{ skill.id }}/delete"
            onsubmit="return confirm('確定刪除「{{ skill.name }}」及其所有子技能？')">
        <button class="btn skill-del-btn" type="submit">✕</button>
      </form>
    </div>
    {% else %}
    <div style="color: var(--text-dim); font-size: 11px; letter-spacing: 2px;">NO SKILLS YET</div>
    {% endfor %}

    <button class="btn" style="margin-top:16px; font-size:10px;"
            onclick="document.getElementById('add-skill-form').style.display='block'; this.style.display='none'">
      + 新增技能
    </button>
    <form id="add-skill-form" class="xp-form" method="POST" action="/category/{{ category.id }}/add_skill"
          style="display:none; margin-top:12px; max-width:500px;">
      <h3>新增技能</h3>
      <div class="form-row">
        <label>名稱</label>
        <input type="text" name="name" placeholder="技能名稱" required>
      </div>
      <div class="form-row">
        <label>說明</label>
        <input type="text" name="description" placeholder="選填">
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn" type="submit">ADD</button>
        <button class="btn" type="button" style="border-color:var(--text-dim); color:var(--text-dim);"
                onclick="document.getElementById('add-skill-form').style.display='none'; document.querySelector('.btn[onclick*=add-skill-form]').style.display='inline-block'">CANCEL</button>
      </div>
    </form>
  </div>

</div>
</body>
</html>
