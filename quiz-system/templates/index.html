<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>丙級學科練習</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#16181d; --muted:#69707d;
  --line:#e3e6ea; --accent:#2563eb; --ok:#15803d; --bad:#c02626;
  --ok-bg:#e9f7ee; --bad-bg:#fdeceb; --sel:#eef4ff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12141a; --card:#1a1d25; --fg:#e6e8ec; --muted:#9aa2af;
    --line:#2b303b; --accent:#6ea0ff; --ok:#5ec98a; --bad:#ff7b72;
    --ok-bg:#16281d; --bad-bg:#2b1a19; --sel:#1b2740;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.65 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:9;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
.spacer{flex:1}
#progress{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);padding:8px 16px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px}
#result{display:none;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:24px;margin-bottom:20px;text-align:center}
#result .score{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
#result .sub{color:var(--muted);margin-top:4px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;margin-bottom:14px}
.q .head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.q .no{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.q .flag{margin-left:auto;font-size:12px;padding:2px 10px;border-radius:999px;background:transparent;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.q .flag:hover{color:var(--accent);border-color:var(--accent)}
.q .flag.on{color:#c9a227;border-color:#c9a227}
.q .cat{font-size:12px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:1px 8px;white-space:nowrap}
.q .stem{font-weight:500;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  padding:10px 14px;line-height:1.5;transition:background .12s,border-color .12s}
.opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);width:1.2em}
.opt:hover:not(:disabled){background:var(--sel)}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.opt.sel .k{color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .k{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .k{color:var(--bad)}
.verdict{font-size:13px;margin-top:10px;color:var(--muted)}
.verdict b.ok{color:var(--ok)}
.verdict b.bad{color:var(--bad)}
aside{max-width:860px;margin:0 auto;padding:0 16px 60px;color:var(--muted);font-size:14px}
aside h2{font-size:14px;font-weight:600;color:var(--fg);margin:0 0 8px}
#history{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#history li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);
  padding:6px 2px}
#history .s{font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
.empty{color:var(--muted);padding:24px;text-align:center}
.mode-tag{font-size:12px;color:var(--bad);border:1px solid var(--bad);
  border-radius:999px;padding:1px 9px;display:none}
.mode-tag.on{display:inline}
</style>
</head>
<body>
<header>
  <h1>丙級學科練習</h1>
  <span id="mode" class="mode-tag"></span>
  <span id="pool-progress" style="color:var(--muted);font-size:13px"></span>
  <span id="progress"></span>
  <span class="spacer"></span>
  <button id="allq">全部題目</button>
  <button id="carry">進位題</button>
  <button id="unmastered">未熟練</button>
  <button id="mistakes">錯題重刷</button>
  <button id="again" style="display:none">再來一份</button>
  <button id="submit" class="primary">交卷</button>
</header>

<main>
  <div id="result"></div>
  <div id="questions"><div class="empty">載入中…</div></div>
</main>

<aside>
  <h2>最近成績</h2>
  <ul id="history"><li class="empty">尚無紀錄</li></ul>
</aside>

<script>
const TOTAL = {{ total_questions }};
const COUNT = 50;
const LETTERS = ['A','B','C','D'];
const MODE_LABEL = { mistakes: '錯題重刷', carry: '進位題', unmastered: '未熟練' };
const state = { items: [], picked: {}, flagged: {}, submitted: false, result: null, mode: 'all' };

const $ = id => document.getElementById(id);

async function loadQuiz(mode){
  mode = mode || 'all';
  state.mode = mode;
  $('questions').innerHTML = '<div class="empty">載入中…</div>';
  $('result').style.display = 'none';
  $('again').style.display = 'none';
  $('submit').style.display = '';
  $('submit').disabled = true;      // 新題回來前不可交卷，避免送出上一份
  state.items = [];
  state.picked = {};
  state.flagged = {};
  state.submitted = false;
  state.result = null;
  $('mode').textContent = MODE_LABEL[mode] || '';
  $('mode').className = MODE_LABEL[mode] ? 'mode-tag on' : 'mode-tag';
  try{
    const r = await (await fetch(`api/quiz?mode=${mode}&count=${Math.min(COUNT, TOTAL)}`)).json();
    if(!r.ok) throw new Error(r.error || '載入失敗');
    state.items = r.items;
    state.picked = {};
    state.flagged = {};
    state.submitted = false;
    state.result = null;
    if(!state.items.length){
      const emptyMsg = mode === 'carry' ? '目前沒有符合的進位題，請確認題庫內容。'
                     : mode === 'mistakes' ? '目前沒有錯題，先去一般練習吧。'
                     : mode === 'unmastered' ? '全部題目都已熟練（答對滿 10 次），去一般練習吧。'
                     : '目前沒有題目。';
      $('questions').innerHTML = `<div class="empty">${emptyMsg}</div>`;
      $('submit').disabled = true;
      updateProgress();
      return;
    }
    $('submit').disabled = false;
    render();
    updateProgress();
    window.scrollTo(0, 0);
  }catch(e){
    state.items = [];
    state.picked = {};
    state.flagged = {};
    state.submitted = false;
    state.result = null;
    $('submit').disabled = true;
    $('questions').innerHTML = `<div class="empty">載入失敗：${esc(e.message)}</div>`;
  }
}

function render(){
  const detailByQid = {};
  if(state.submitted && state.result){
    for(const d of state.result.details) detailByQid[d.qid] = d;
  }

  // 交卷後只留「答錯」與「標記不確定」的題目；保留原始題號，避免對照時混淆
  const shown = state.items
    .map((it, i) => ({ it, i }))
    .filter(({ it }) => {
      if(!state.submitted) return true;
      const d = detailByQid[it.qid];
      return state.flagged[it.qid] || (d && !d.correct);
    });

  if(!shown.length && state.submitted){
    $('questions').innerHTML = '<div class="empty">🎉 全部答對，也沒有標記不確定的題目</div>';
    return;
  }

  $('questions').innerHTML = shown.map(({ it, i }) => {
    const d = detailByQid[it.qid];
    const opts = it.opts.map((text, idx) => {
      const cls = ['opt'];
      if(!state.submitted){
        if(state.picked[it.qid] === idx) cls.push('sel');
      }else if(d){
        if(idx === d.answer_index) cls.push('ok');
        else if(idx === d.picked) cls.push('bad');
      }
      const dis = state.submitted ? ' disabled' : '';
      const label = state.submitted ? '' : ` onclick="pick(${it.qid}, ${idx})"`;
      return `<button class="${cls.join(' ')}"${dis}${label}>`
           + `<span class="k">${LETTERS[idx]}</span><span>${esc(text)}</span></button>`;
    }).join('');

    let verdict = '';
    if(d){
      verdict = d.correct
        ? '<div class="verdict"><b class="ok">✓ 答對</b></div>'
        : `<div class="verdict"><b class="bad">✗ 答錯</b>　正解：${LETTERS[d.answer_index]}`
          + `${d.picked === null ? '（未作答）' : ''}</div>`;
    }

    // 交卷後不顯示標記按鈕：/api/mark 的不確定標記與答錯共用同一份
    // mistakes.json，在此取消會讓該題從錯題庫消失、答對的題目也會
    // 直接從清單濾掉，誤觸一次就救不回來。
    const flagBtn = state.submitted ? '' :
      `<button class="flag${state.flagged[it.qid] ? ' on' : ''}" onclick="markUncertain(${it.qid})" title="再按一次可取消">${state.flagged[it.qid] ? '✓ 已標記（點擊取消）' : '❓ 不確定'}</button>`;

    return `<article class="q">
      <div class="head"><span class="no">${i + 1}</span><span class="stem">${esc(it.q)}</span>${flagBtn}</div>
      <div class="cat" style="display:inline-block;margin-bottom:10px">${esc(it.cat)}</div>
      <div class="opts">${opts}</div>
      ${verdict}
    </article>`;
  }).join('');
}

async function markUncertain(qid){
  const on = !state.flagged[qid];          // 再按一次可取消誤標
  const myItems = state.items;             // 記錄當下這份考卷
  try{
    const r = await fetch('api/mark', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({qid, marked: on})
    });
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '標記失敗');
    // 等待期間換了考卷就丟棄回應，否則會把舊考卷的標記寫進新考卷
    if(state.items !== myItems) return;
    state.flagged[qid] = on;
    render();
    loadHistory();      // 錯題按鈕的計數與 disabled 狀態要跟著更新
  }catch(e){
    alert('標記失敗：' + e.message);
  }
}

function pick(qid, idx){
  if(state.submitted) return;
  state.picked[qid] = idx;
  updateProgress();
  render();
}

function updateProgress(){
  const n = state.items.filter(it => state.picked[it.qid] !== undefined).length;
  $('progress').textContent = `已答 ${n}/${state.items.length}`;
}

async function submit(){
  const unanswered = state.items.filter(it => state.picked[it.qid] === undefined).length;
  if(unanswered && !confirm(`還有 ${unanswered} 題未作答，確定交卷？`)) return;

  const payload = { items: state.items.map(it => ({
    qid: it.qid, order: it.order,
    picked: state.picked[it.qid] === undefined ? null : state.picked[it.qid],
  })) };

  $('submit').disabled = true;
  try{
    const r = await (await fetch('api/submit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    })).json();
    if(!r.ok) throw new Error(r.error || '交卷失敗');

    state.submitted = true;
    state.result = r;
    const res = $('result');
    res.style.display = 'block';
    res.innerHTML = `<div class="score">${r.score} 分</div>`
      + `<div class="sub">答對 ${r.correct} / ${r.total} 題　·　${r.at}</div>`;
    $('again').style.display = '';
    $('submit').style.display = 'none';
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
    loadHistory();
    loadPoolProgress();
  }catch(e){
    alert(`交卷失敗：${e.message}`);
    $('submit').disabled = false;
  }
}

async function loadPoolProgress(){
  try{
    const d = await (await fetch('/api/progress')).json();
    $('pool-progress').textContent =
      `未做過 ${d.unseen} ｜ 未熟練 ${d.unmastered} ｜ 已熟練 ${d.mastered}`;
  }catch(e){}
}
async function loadHistory(){
  try{
    const r = await (await fetch('api/history?limit=10')).json();
    const n = r.mistake_count || 0;
    $('mistakes').textContent = `錯題重刷（${n}）`;
    $('mistakes').disabled = n === 0;
    const list = $('history');
    if(!r.records || !r.records.length){
      list.innerHTML = '<li class="empty">尚無紀錄</li>';
      return;
    }
    list.innerHTML = r.records.map(x =>
      `<li><span>${esc(x.at)}</span><span class="s">${x.score} 分（${x.correct}/${x.total}）</span></li>`
    ).join('');
  }catch(e){ /* 歷史失敗不影響作答 */ }
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('submit').addEventListener('click', submit);
$('again').addEventListener('click', () => loadQuiz(state.mode));
function switchMode(mode){
  const answered = Object.keys(state.picked).length;
  const label = MODE_LABEL[mode] || '一般練習';
  if (answered && !state.submitted
      && !confirm(`切換到${label}會丟棄目前的作答，確定嗎？`)) return;
  loadQuiz(mode);
}
$('allq').addEventListener('click', () => switchMode('all'));
$('carry').addEventListener('click', () => switchMode('carry'));
$('unmastered').addEventListener('click', () => switchMode('unmastered'));
$('mistakes').addEventListener('click', () => switchMode('mistakes'));
loadQuiz();
loadHistory();
loadPoolProgress();
</script>
</body>
</html>
