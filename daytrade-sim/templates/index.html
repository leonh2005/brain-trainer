<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>當沖模擬（即時報價）</title>
<script src="/static/lightweight-charts.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #e6edf3;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 14px;
  }
  #toolbar {
    background: #161b22; border-bottom: 1px solid #30363d;
    padding: 12px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #toolbar h1 { font-size: 16px; margin: 0 16px 0 0; color: #58a6ff; font-weight: 700; }
  input {
    background: #21262d; border: 1px solid #30363d; color: #e6edf3;
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  input:focus { outline: none; border-color: #58a6ff; }
  input#code { width: 120px; }
  #code-wrap { position: relative; }
  #code-suggest {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
    background: #21262d; border: 1px solid #30363d; border-radius: 6px;
    min-width: 180px; max-height: 240px; overflow-y: auto;
  }
  #code-suggest.show { display: block; }
  #code-suggest div {
    padding: 6px 10px; cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  #code-suggest div:hover { background: #30363d; }
  #code-suggest .sg-code { color: #8b949e; margin-right: 6px; }
  button {
    border: 1px solid #30363d; background: #21262d; color: #e6edf3;
    border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: #58a6ff; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.buy { background: #3fb950; border-color: #3fb950; color: #0d1117; font-weight: 700; }
  button.sell { background: #f85149; border-color: #f85149; color: #0d1117; font-weight: 700; }
  button.flat { background: #21262d; }
  #gw-status { font-size: 12px; color: #8b949e; margin-left: auto; }
  #gw-status.ok::before { content: "● "; color: #3fb950; }
  #gw-status.bad::before { content: "● "; color: #f85149; }

  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 20px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; color: #8b949e; margin: 0 0 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  #price-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
  #price-now { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #price-change { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #price-meta { font-size: 12px; color: #8b949e; }
  #price-hilo { font-size: 12px; color: #8b949e; margin-top: 2px; margin-bottom: 8px; }
  #chart-price-wrap { position: relative; }
  #chart-price { width: 100%; height: 300px; }
  #chart-tooltip {
    display: none; position: absolute; z-index: 10; pointer-events: none;
    background: #21262d; border: 1px solid #30363d; border-radius: 6px;
    padding: 4px 8px; font-size: 12px; font-variant-numeric: tabular-nums;
    color: #e6edf3; white-space: nowrap;
  }
  #chart-macd { width: 100%; height: 270px; margin-top: 4px; border-top: 1px solid #21262d; }
  #chart-empty { color: #8b949e; text-align: center; padding: 140px 0; }

  .trade-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .trade-row input { width: 90px; }
  .trade-row button { flex: 1; }
  .row2 { display: flex; gap: 8px; }

  .po-dir-btn { flex: 1; opacity: .4; }
  .po-dir-btn.active { opacity: 1; }
  .period-row { display: flex; gap: 8px; margin: 8px 0; }
  .period-btn { flex: none; font-size: 12px; padding: 4px 12px; opacity: .5; }
  .period-btn.active { opacity: 1; background: #1f6feb; border-color: #1f6feb; }
  .po-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 0; border-top: 1px solid #30363d; font-size: 12.5px;
  }
  .po-row .po-cancel { flex: none; font-size: 11px; padding: 3px 8px; }
  .log-delete { font-size: 11px; padding: 2px 7px; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: #8b949e; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid #30363d; }
  td { padding: 6px 8px; border-bottom: 1px solid #21262d; font-variant-numeric: tabular-nums; }
  .empty-row td { color: #8b949e; text-align: center; padding: 20px 0; }
  #log-wrap { max-height: 300px; overflow-y: auto; overflow-x: auto; }

  .movers-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .movers-note { font-size: 11.5px; color: #8b949e; }
  .movers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .movers-grid { grid-template-columns: 1fr; } }
  .movers-col h3 { font-size: 12px; margin: 0 0 8px; font-weight: 700; }
  .movers-col.up h3 { color: #f85149; }
  .movers-col.down h3 { color: #3fb950; }
  .mover-row {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px;
    cursor: pointer; font-size: 12.5px;
  }
  .mover-row:hover { background: #21262d; }
  .mover-row .m-code { font-family: ui-monospace, monospace; color: #8b949e; width: 40px; flex: none; }
  .mover-row .m-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mover-row .m-price { font-weight: 700; font-variant-numeric: tabular-nums; width: 58px; text-align: right; flex: none; }
  .mover-row .m-rate { font-weight: 700; font-variant-numeric: tabular-nums; width: 118px; text-align: right; flex: none; font-size: 12.5px; }
  .mover-row .m-vol { font-size: 11px; color: #8b949e; width: 60px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .movers-wrap { max-width: 1280px; margin: 0 auto; padding: 20px 20px 0; }
  .index-wrap { max-width: 1280px; margin: 0 auto; padding: 14px 20px 0; }
  #index-price { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #index-chart { width: 100%; height: 140px; margin-top: 8px; }

  #bidask-body { font-variant-numeric: tabular-nums; }
  .ba-ratio { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-bottom: 10px; }
  .ba-ratio-track { flex: 1; display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
  .ba-ratio-bid { background: #3fb950; height: 100%; }
  .ba-ratio-ask { background: #f85149; height: 100%; }
  .ba-cols { display: flex; gap: 8px; }
  .ba-cols .ba-col { flex: 1; min-width: 0; }
  .ba-cols .ba-col-head { font-size: 10.5px; color: #8b949e; padding: 0 4px 5px; font-weight: 600; }
  .ba-row { display: flex; align-items: center; gap: 4px; padding: 2px 4px; font-size: 11px; }
  .ba-row .ba-price { width: 44px; flex: none; font-weight: 700; cursor: pointer; border-radius: 3px; }
  .ba-row .ba-price:hover { background: #21262d; text-decoration: underline; }
  .ba-row .ba-vol { width: 34px; flex: none; text-align: right; color: #8b949e; font-size: 10px; }
  .ba-row .ba-vol:first-child { text-align: left; }
  .ba-bar { flex: 1; height: 7px; background: #21262d; border-radius: 2px; overflow: hidden; }
  .ba-bar-fill { height: 100%; }
  .ba-bar.buy { display: flex; justify-content: flex-end; }
  .ba-bar.buy .ba-bar-fill { background: #3fb950; }
  .ba-bar.sell .ba-bar-fill { background: #f85149; }
  #bidask-empty { color: #8b949e; text-align: center; padding: 20px 0; font-size: 12.5px; }

  .holdings-wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
  .holdings-label { padding: 16px 0 8px; color: #8b949e; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .holdings-grid { display: flex; gap: 14px; flex-wrap: wrap; }
  .hcard { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px; width: 220px; cursor: pointer; }
  .hcard:hover { border-color: #58a6ff; }
  .hcard-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .hcard-name { font-size: 13.5px; font-weight: 700; }
  .hcard-pos { font-size: 11.5px; color: #8b949e; margin-top: 2px; }
  .hcard-price { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .pos-up { color: #f85149; }   /* 台股慣例：紅漲 */
  .pos-down { color: #3fb950; } /* 綠跌 */
  .hcard-chart { width: 100%; height: 100px; }
  .hcard-pnl { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .hcard-buys { margin-top: 8px; }
  .hcard-buys-label { font-size: 11px; color: #8b949e; font-weight: 700; margin-bottom: 4px; }
  .hcard-buys-row { font-size: 11.5px; color: #8b949e; }
  .hcard-po { margin-top: 10px; padding-top: 10px; border-top: 1px solid #30363d; cursor: default; }
  .hcard-po-label { font-size: 11px; color: #8b949e; font-weight: 700; margin-bottom: 6px; }
  .hcard-po-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .hcard-po-row:last-child { margin-bottom: 0; }
  .hcard-po-row input, .hcard-po-row select { flex: 1; min-width: 0; font-size: 12px; padding: 4px 6px; }
  .hcard-po .po-submit { width: 100%; font-size: 12px; padding: 5px; }
  .hcard-po-list { margin-top: 6px; }
  .hcard-po-list .po-row { padding: 5px 0; font-size: 11.5px; border-top: 1px solid #21262d; }
</style>
</head>
<body>

<div id="toolbar">
  <h1>當沖模擬</h1>
  <div id="code-wrap">
    <input id="code" placeholder="股票代號或名稱" maxlength="10" autocomplete="off">
    <div id="code-suggest"></div>
  </div>
  <button class="primary" id="btn-start">開始模擬</button>
  <button id="btn-reset">重置</button>
  <span id="gw-status">連線檢查中…</span>
</div>

<div class="movers-wrap">
  <div class="card" style="margin-bottom:0">
    <div class="movers-head">
      <h2 style="margin:0">今日強勢／弱勢股（漲跌幅≥3% 且成交量>15,000張）</h2>
      <span style="display:flex;align-items:center;gap:8px">
        <span class="movers-note" id="movers-updated">載入中…</span>
        <button id="movers-refresh" title="立即刷新" style="font-size:11px;padding:3px 9px">🔄 手動刷新</button>
      </span>
    </div>
    <div class="movers-grid">
      <div class="movers-col up">
        <h3>▲ 漲幅 ≥3%</h3>
        <div id="movers-up"><div class="empty-row" style="padding:12px 0;color:#8b949e">載入中…</div></div>
      </div>
      <div class="movers-col down">
        <h3>▼ 跌幅 ≥3%</h3>
        <div id="movers-down"><div class="empty-row" style="padding:12px 0;color:#8b949e">載入中…</div></div>
      </div>
    </div>
  </div>
</div>

<div class="index-wrap">
  <div class="card" style="margin-bottom:0">
    <div class="hcard-head" style="margin-bottom:0">
      <div>
        <div class="hcard-name">加權指數</div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <div id="index-price">--</div>
          <span id="index-change" class="hcard-pos"></span>
        </div>
      </div>
    </div>
    <div id="index-chart"></div>
  </div>
</div>

<div class="holdings-wrap" id="holdings-wrap" style="display:none">
  <div class="holdings-label">持有部位</div>
  <div class="holdings-grid" id="holdings-grid"></div>
</div>

<div class="layout">
  <div class="card-col" id="col-left">
    <div class="card" data-card-id="chart">
      <div id="price-head">
        <div id="price-code">—</div>
        <div id="price-now">--</div>
        <div id="price-change"></div>
      </div>
      <div id="price-meta">尚未開始模擬</div>
      <div id="price-hilo"></div>
      <div class="period-row" id="period-row">
        <button type="button" class="period-btn active" data-period="1m">1分K</button>
        <button type="button" class="period-btn" data-period="5m">5分K</button>
        <button type="button" class="period-btn" data-period="1d">日K</button>
        <button type="button" class="period-btn" data-period="wave">日波圖</button>
        <button type="button" class="period-btn" id="ma-toggle-btn">均線 開</button>
      </div>
      <div id="chart-empty">輸入代號並按「開始模擬」查看即時走勢</div>
      <div id="chart-price-wrap">
        <div id="chart-price"></div>
        <div id="chart-tooltip"></div>
      </div>
      <div id="chart-macd"></div>
    </div>

    <div class="card" data-card-id="log">
      <h2>交易紀錄</h2>
      <div id="log-wrap">
        <table>
          <thead><tr><th>時間</th><th>標的</th><th>動作</th><th>價格</th><th>股數</th><th>手續費/稅</th><th>已實現損益</th><th></th></tr></thead>
          <tbody id="log-body"><tr class="empty-row"><td colspan="8">尚無交易</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card" data-card-id="daily-pnl">
      <h2>每日損益紀錄</h2>
      <p style="font-size:11.5px;color:#8b949e;margin:0 0 10px">永久存在後端資料庫，跟瀏覽器資料分開，重置模擬或清瀏覽器資料都不會遺失。</p>
      <div id="daily-winrate" style="font-size:13px;font-weight:700;margin-bottom:10px"></div>
      <div id="daily-pnl-wrap">
        <table>
          <thead><tr><th>日期</th><th>交易次數</th><th>手續費+稅</th><th>已實現損益（淨）</th><th>報酬率</th></tr></thead>
          <tbody id="daily-pnl-body"><tr class="empty-row"><td colspan="5">載入中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card-col" id="col-right">
    <div class="card" data-card-id="order">
      <h2>下單</h2>
      <div class="trade-row">
        <input id="order-price" type="number" step="0.05" placeholder="市價" style="flex:1">
        <button type="button" id="btn-clear-price" style="flex:none;font-size:12px;padding:6px 10px">市價</button>
      </div>
      <div class="trade-row">
        <input id="qty" type="number" placeholder="張數" min="1" step="1" value="1"> 張
      </div>
      <div class="row2">
        <button class="buy" id="btn-buy" disabled>買進 ▲</button>
        <button class="sell" id="btn-sell" disabled>賣出 ▼</button>
      </div>
      <div class="row2" style="margin-top:8px">
        <button class="flat" id="btn-flat" disabled style="width:100%">全部平倉</button>
      </div>
      <p style="font-size:11.5px;color:#8b949e;margin:10px 0 0">賣出超過持股會自動視為放空，符合當沖先賣後買邏輯。純模擬，不會真實下單。</p>
    </div>

    <div class="card" data-card-id="bidask">
      <h2>最佳五檔</h2>
      <div id="bidask-body">
        <div id="bidask-empty">尚未開始模擬</div>
      </div>
    </div>

  </div>
</div>

<script>
const STORAGE_KEY = 'daytrade-sim-state';
let STATE = null;
let priceChart = null, macdChart = null;
let priceSeries = null, vwapSeries = null, volumeSeries = null;
let macdSeries = null, macdSignalSeries = null, macdHistSeries = null;
let ma5Series = null, ma10Series = null, ma20Series = null;
let pollTimer = null;
let chartPeriod = '1m'; // '1m' | '5m' | '1d' | 'wave'：只有 1m 有即時逐筆更新，其餘用固定資料重畫（見 loadIntraday）
const holdingCharts = {}; // 非 active 的庫存：code -> { chart, series, lastTs, price, pollTimer }

const DEFAULT_CAPITAL = 100000; // 本金只是內部現金流的起始值，不再顯示也不影響報酬率算法，固定用一個數字即可
function freshState(capital) {
  return { capital, cash: capital, active: null, positions: {}, trades: [], pendingOrders: [] };
}

function ensurePosition(code) {
  if (!STATE.positions[code]) STATE.positions[code] = { name: null, position: 0, avgCost: 0, realizedPnl: 0 };
  return STATE.positions[code];
}

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
function loadState() {
  // 舊版單一部位格式沒有 positions 欄位，直接視為空狀態（模擬工具、資料不值錢，不寫遷移邏輯）
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!s || !s.positions) return null;
    if (!s.pendingOrders) s.pendingOrders = []; // 舊資料沒有這個欄位，補空陣列
    // 舊交易紀錄沒有 id，補上才能用刪除功能定位到該筆
    s.trades.forEach(t => { if (!t.id) t.id = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`; });
    return s;
  } catch (e) { return null; }
}

function fmtMoney(n) { return (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString(); }
function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(2) + '%'; }
function upDownClass(n) { return n > 0 ? 'pos-up' : (n < 0 ? 'pos-down' : ''); }

// 三張圖表各自獨立（真正分開的附圖，不是共用一個 pane 硬切 scaleMargins），
// 三關價這種掛在價格軸上的水平線才不會被成交量/MACD 的自動縮放拖著跑位。
// 靠同步 visible logical range 讓三張圖的時間軸對得起來（一張拉動、其他兩張跟著動）。
function syncTimeScales(charts) {
  let syncing = false;
  charts.forEach(c => {
    c.timeScale().subscribeVisibleLogicalRangeChange(range => {
      if (syncing || !range) return;
      syncing = true;
      charts.forEach(other => { if (other !== c) other.timeScale().setVisibleLogicalRange(range); });
      syncing = false;
    });
  });
}

function initChart() {
  const priceEl = document.getElementById('chart-price');
  const macdEl = document.getElementById('chart-macd');
  priceEl.innerHTML = ''; macdEl.innerHTML = '';
  document.getElementById('chart-empty').style.display = 'none';
  gateLines = []; maLines = []; hiLoLines = { high: null, low: null }; openLimitLines = []; // 舊 priceSeries 已經整個丟棄，殘留的線物件參照也一併清掉

  const common = {
    localization: { locale: 'zh-TW' }, // 避免依賴 navigator.language（某些無頭瀏覽器環境下該值是 undefined，會讓內部 Intl 格式化拋錯）
    layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
    grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
    rightPriceScale: { borderColor: '#30363d' },
  };
  priceChart = LightweightCharts.createChart(priceEl, {
    ...common,
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#30363d', visible: false },
    width: priceEl.clientWidth, height: 300,
  });
  macdChart = LightweightCharts.createChart(macdEl, {
    ...common,
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#30363d' },
    width: macdEl.clientWidth, height: 270,
  });

  if (chartPeriod === '1m') {
    priceSeries = priceChart.addLineSeries({ color: '#58a6ff', lineWidth: 2 });
    vwapSeries = priceChart.addLineSeries({ color: '#e3b341', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  } else if (chartPeriod === 'wave') {
    // 日波圖：當天逐分成交價連成一條乾淨的連續曲線，不做OHLC濃縮所以沒有K棒，
    // 也不疊VWAP／三關價／今高今低／均線，單純看價格波形（跟江波圖的傳統定義一致）
    priceSeries = priceChart.addLineSeries({ color: '#58a6ff', lineWidth: 2 });
    vwapSeries = null;
  } else {
    // 5分K/日K：改蠟燭圖，台股慣例紅漲綠跌；VWAP、三關價、當日均線都是單日盤中概念，跨K棒週期不畫
    priceSeries = priceChart.addCandlestickSeries({
      upColor: '#f85149', downColor: '#3fb950', borderVisible: false,
      wickUpColor: '#f85149', wickDownColor: '#3fb950',
    });
    vwapSeries = null;
  }
  // 主圖價格軸底部留白給成交量疊圖用，不然K棒/折線會整個貼滿畫布，蓋住底下那層量柱
  priceSeries.priceScale().applyOptions({ scaleMargins: { top: 0.05, bottom: 0.22 } });
  padAutoscale(priceSeries);

  // 主圖疊加的移動平均線（MA5/10/20，隨K棒逐點計算，跟 renderDailyMA 的固定水平當日均線是不同概念）
  // 1分K／日波圖不畫均線（renderMA 不會被呼叫），5分K/日K 依 maEnabled 開關決定初始顯示
  const maVisible = (chartPeriod === '5m' || chartPeriod === '1d') && maEnabled;
  ma5Series = priceChart.addLineSeries({ color: '#a371f7', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, visible: maVisible });
  ma10Series = priceChart.addLineSeries({ color: '#79c0ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, visible: maVisible });
  ma20Series = priceChart.addLineSeries({ color: '#ffa657', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, visible: maVisible });
  updateMAToggleBtn();

  // 成交量併入主圖，用獨立 price scale 疊在下方一層（暗色柱，不佔用主圖右軸的價格刻度）
  volumeSeries = priceChart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'volume-overlay' });
  priceChart.priceScale('volume-overlay').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

  macdSeries = macdChart.addLineSeries({ color: '#58a6ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  macdSignalSeries = macdChart.addLineSeries({ color: '#e3b341', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  macdHistSeries = macdChart.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false });

  syncTimeScales([priceChart, macdChart]);

  // 滑鼠移到任一張圖（價格/成交量/MACD）上時，垂直虛線要貫通三張圖，並用浮動 tooltip
  // 顯示那個時間點的價格、成交量、MACD——右側軸上的即時價標籤只會跟著最新一筆跑，
  // 過去的點完全看不到數字，所以另外做一個跟著游標走的提示框。
  const tooltip = document.getElementById('chart-tooltip');
  let crosshairSyncing = false;
  const crosshairCharts = [
    { chart: priceChart, series: priceSeries },
    { chart: macdChart, series: macdSeries },
  ];
  crosshairCharts.forEach(({ chart: sourceChart }) => {
    sourceChart.subscribeCrosshairMove(param => {
      if (crosshairSyncing) return;
      if (!param.time) {
        tooltip.style.display = 'none';
        crosshairSyncing = true;
        crosshairCharts.forEach(({ chart: c }) => c.clearCrosshairPosition());
        crosshairSyncing = false;
        return;
      }
      const bar = barsByTime.get(param.time);
      if (!bar) { tooltip.style.display = 'none'; return; }

      crosshairSyncing = true;
      crosshairCharts.forEach(({ chart: c, series: s }) => {
        if (c !== sourceChart) c.setCrosshairPosition(0, param.time, s);
      });
      crosshairSyncing = false;

      const t = new Date(param.time * 1000);
      const label = chartPeriod === '1d'
        ? `${t.getUTCFullYear()}-${String(t.getUTCMonth() + 1).padStart(2, '0')}-${String(t.getUTCDate()).padStart(2, '0')}`
        : `${String(t.getUTCHours()).padStart(2, '0')}:${String(t.getUTCMinutes()).padStart(2, '0')}`;
      tooltip.innerHTML =
        `${label}　價 ${bar.price.toFixed(2)}<br>` +
        `量 ${bar.volume.toLocaleString()}<br>` +
        `MACD ${bar.macd.toFixed(3)}　訊號 ${bar.signal.toFixed(3)}`;
      tooltip.style.display = 'block';
      const point = param.point || { x: 0, y: 0 };
      let left = point.x + 12;
      if (left + tooltip.offsetWidth + 8 > priceEl.clientWidth) left = point.x - tooltip.offsetWidth - 12;
      tooltip.style.left = `${left}px`;
      tooltip.style.top = '4px';
    });
  });

  window.addEventListener('resize', () => {
    if (!priceChart) return;
    priceChart.applyOptions({ width: priceEl.clientWidth });
    macdChart.applyOptions({ width: macdEl.clientWidth });
  });
}

// 簡單移動平均線，points 為 {time, value}[]，資料筆數不足 period 的開頭直接不產出該點（讓線從足量處開始畫）
function computeSMA(points, period) {
  const out = [];
  let sum = 0;
  for (let i = 0; i < points.length; i++) {
    sum += points[i].value;
    if (i >= period) sum -= points[i - period].value;
    if (i >= period - 1) out.push({ time: points[i].time, value: +(sum / period).toFixed(2) });
  }
  return out;
}
function renderMA(points) {
  ma5Series.setData(computeSMA(points, 5));
  ma10Series.setData(computeSMA(points, 10));
  ma20Series.setData(computeSMA(points, 20));
}

// MACD(5,35,5)：快線 EMA5、慢線 EMA35 之差為 MACD 線，MACD 線再取 EMA5 為訊號線，兩者之差畫成柱狀圖
function ema(values, period) {
  const k = 2 / (period + 1);
  const out = new Array(values.length);
  out[0] = values[0];
  for (let i = 1; i < values.length; i++) out[i] = values[i] * k + out[i - 1] * (1 - k);
  return out;
}
function computeMACD(data, fast = 5, slow = 35, signalPeriod = 5) {
  const closes = data.map(d => d.value);
  const emaFast = ema(closes, fast);
  const emaSlow = ema(closes, slow);
  const macdLine = closes.map((_, i) => emaFast[i] - emaSlow[i]);
  const signalLine = ema(macdLine, signalPeriod);
  return data.map((d, i) => ({
    time: d.time, macd: macdLine[i], signal: signalLine[i], hist: macdLine[i] - signalLine[i],
  }));
}

const INDEX_CODE = 'IX0001';

// 固定時間軸 09:00~13:30：不管現在幾點、資料有多少，最左邊永遠是開盤，線只會往右畫，

// 固定時間軸 09:00~13:30：不管現在幾點、資料有多少，最左邊永遠是開盤，線只會往右畫，
// 不會因為資料變多就整條跟著重新縮放。所有走勢圖（大卡片、加權指數、庫存迷你卡）共用。
function lockChartRange(chart) {
  chart.timeScale().setVisibleRange({ from: taipeiFixedTs(9, 0), to: taipeiFixedTs(13, 30) });
}
function lockIndexRange() { lockChartRange(indexChart); }

function renderIndexSeries(data) {

  }));

  indexVolumeSeries.setData(data.map((pt, i) => ({

// Lightweight Charts 內部一律用 UTC 曆面畫刻度標籤，不會轉換成瀏覽器時區，
// 所以刻意把「台北時間的時鐘數字」當成 UTC 餵進去，圖表顯示出來的刻度才會是 09:01
// 而不是被減 8 小時變成 01:01。分鐘級別的秒數固定歸零，同一分鐘內反覆 update() 同一點，
// 分鐘真的變了才前進到下一格（一分鐘動一格，不會每次輪詢就新增一格）。
function taipeiMinuteTs(date) {
  const t = new Date(date.toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  return Math.floor(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate(), t.getHours(), t.getMinutes(), 0) / 1000);
}
// 今天固定某個台北時刻的 timestamp，算法跟 taipeiMinuteTs 同一套「假 UTC」規則。
function taipeiFixedTs(hour, minute) {
  const t = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  return Math.floor(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate(), hour, minute, 0) / 1000);
}
function taipeiDateStr(date) {
  const t = new Date(date.toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
}

async function fetchIntradaySeries(code) {
  const r = await fetch(`/api/intraday?code=${encodeURIComponent(code)}`);
  const d = await r.json();
  if (!d.ok || !d.points || !d.points.length) return [];
  const nowTaipei = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  const today = `${nowTaipei.getFullYear()}-${String(nowTaipei.getMonth() + 1).padStart(2, '0')}-${String(nowTaipei.getDate()).padStart(2, '0')}`;
  return d.points
    .map(p => ({ time: Math.floor(new Date(`${today}T${p.t}:00Z`).getTime() / 1000), value: p.price, volume: p.volume || 0 }))
    .filter(pt => pt.time > 0)
    .sort((a, b) => a.time - b.time);
}

// 三關價：只在落於「今天走勢圖的價格尺度」附近才畫線，離太遠（超出今日高低±50%的振幅）就不畫，
// 避免關卡價跟今天實際走勢差太多時，把圖表 Y 軸硬拉開變得沒意義。
let barsByTime = new Map(); // time -> {price, volume, macd, signal, hist}，給三張圖共用的 crosshair tooltip 查值用
let gateLines = [];
function renderGates(gates, data) {
  gateLines.forEach(line => priceSeries.removePriceLine(line));
  gateLines = [];
  if (!data.length) return;
  const values = data.map(p => p.value);
  const lo = Math.min(...values), hi = Math.max(...values);
  const range = (hi - lo) || hi * 0.02 || 1;
  const margin = range * 0.5;
  const within = v => v >= lo - margin && v <= hi + margin;
  const specs = [
    { key: 'up', label: '上關', color: '#f85149' },
    { key: 'mid', label: '中關', color: '#8b949e' },
    { key: 'dn', label: '下關', color: '#3fb950' },
  ];
  specs.forEach(s => {
    const v = gates[s.key];
    if (v == null || !within(v)) return;
    gateLines.push(priceSeries.createPriceLine({
      price: v, color: s.color, lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: s.label,
    }));
  });
}

// 開盤價/漲停價/跌停價/最低價：跟三關價同一套邏輯畫成水平線。漲跌停用 three_gates 回傳的
// 前一交易日收盤價（prev_close）算 ±10%，開盤價用今天第一筆分K，最低價沿用 todayLow。
let openLimitLines = [];
function renderOpenLimits(gates, data) {
  openLimitLines.forEach(line => priceSeries.removePriceLine(line));
  openLimitLines = [];
  if (!data.length) return;

  const range = (hi - lo) || hi * 0.02 || 1;
  const margin = range * 0.5;
  const within = v => v >= lo - margin && v <= hi + margin;
  const prevClose = gates && gates.prev_close;
  const specs = [
    { v: data[0].value, label: '開盤', color: '#79c0ff' },
    { v: prevClose != null ? +(prevClose * 1.1).toFixed(2) : null, label: '漲停', color: '#f85149' },
    { v: prevClose != null ? +(prevClose * 0.9).toFixed(2) : null, label: '跌停', color: '#3fb950' },
    { v: todayLow, label: '最低', color: '#8b949e' },

  specs.forEach(s => {
    if (s.v == null || !within(s.v)) return;
    openLimitLines.push(priceSeries.createPriceLine({
      price: s.v, color: s.color, lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dotted,
      axisLabelVisible: true, title: s.label,
    }));
  });
}

// 日波圖跟1分K同一份資料但畫成乾淨折線（不逐筆 update，固定資料重畫）；

async function loadOneMinLine(code) {
  try {
    const data = await fetchIntradaySeries(code);
    if (!data.length) return;
    lastChartTs = data[data.length - 1].time;

    todayHigh = Math.max(...data.map(p => p.value));
    todayLow = Math.min(...data.map(p => p.value));
    renderHiLo();

    // 當日均價線（VWAP）：用分K的量價累積算出來，跟主線疊在一起
    let cumPV = 0, cumVol = 0;
    const vwapData = data.map(pt => {
      cumPV += pt.value * pt.volume;
      cumVol += pt.volume;
      return { time: pt.time, value: cumVol > 0 ? +(cumPV / cumVol).toFixed(2) : pt.value };
    });
    vwapSeries.setData(vwapData);

    renderLineSeries(data);

    try {
      const r = await fetch(`/api/three_gates?code=${encodeURIComponent(code)}`);
      const g = await r.json();
      if (g.ok) { renderGates(g, data); renderOpenLimits(g, data); }
    } catch (e) { /* 三關價拿不到就不畫，不影響主圖顯示 */ }

    try {
      const r = await fetch(`/api/daily_ma?code=${encodeURIComponent(code)}`);
      const m = await r.json();
      if (m.ok) renderDailyMA(m, data);
    } catch (e) { /* 均線拿不到就不畫，不影響主圖顯示 */ }
  } catch (e) { /* 沒有歷史資料就從即時報價開始畫 */ }
}

// 把分K資料依固定秒數桶（例如5分K=300秒）聚合成 OHLCV 蠟燭
function aggregateToCandles(points, bucketSeconds) {
  const buckets = new Map();
  points.forEach(pt => {
    const bucketTime = Math.floor(pt.time / bucketSeconds) * bucketSeconds;
    let b = buckets.get(bucketTime);
    if (!b) {
      b = { time: bucketTime, open: pt.value, high: pt.value, low: pt.value, close: pt.value, volume: 0 };
      buckets.set(bucketTime, b);
    }
    b.high = Math.max(b.high, pt.value);
    b.low = Math.min(b.low, pt.value);
    b.close = pt.value;
    b.volume += pt.volume;
  });
  return [...buckets.values()].sort((a, b) => a.time - b.time);
}

// 蠟燭圖＋成交量＋MACD 共用的重畫邏輯，5分K／日K 都走這裡
function renderCandleSeries(bars, isDaily) {
  priceSeries.setData(bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));
  renderMA(bars.map(b => ({ time: b.time, value: b.close })));
  volumeSeries.setData(bars.map((b, i) => ({
    time: b.time, value: b.volume,
    color: i > 0 && b.close < bars[i - 1].close ? 'rgba(63,185,80,0.35)' : 'rgba(248,81,73,0.35)', // 台股慣例：紅漲綠跌，併入主圖後調暗
  })));

  const macdData = computeMACD(bars.map(b => ({ time: b.time, value: b.close })), 5, 35, 5);
  macdSeries.setData(macdData.map(m => ({ time: m.time, value: +m.macd.toFixed(3) })));
  macdSignalSeries.setData(macdData.map(m => ({ time: m.time, value: +m.signal.toFixed(3) })));
  macdHistSeries.setData(macdData.map(m => ({
    time: m.time, value: +m.hist.toFixed(3),
    color: m.hist >= 0 ? '#f85149' : '#3fb950',
  })));

  barsByTime = new Map();
  bars.forEach((b, i) => {
    barsByTime.set(b.time, {
      price: b.close, volume: b.volume,
      macd: macdData[i].macd, signal: macdData[i].signal, hist: macdData[i].hist,
    });
  });

  if (isDaily) {

let lastChartTs = 0;
let todayHigh = null, todayLow = null;
let hiLoLines = { high: null, low: null };
// 今日最高/最低：直接畫成固定水平線疊在價格圖上（跟三關價、均線同一套視覺語言），
// 不是只放在文字說明裡容易被忽略；價格線物件建過一次後用 applyOptions 更新，不用整條重畫。
// 今高/今低剛好等於資料本身的最大最小值，autoscale 算出來的可視範圍上下界會跟這兩個值完全疊在一起，
// 線就貼死在畫布邊緣被裁掉、實際上看不到。用 autoscaleInfoProvider 讓可視範圍主動多留 8% 緩衝，
// 之後不管 scaleMargins 怎麼設，今高/今低都保證落在可視範圍「內側」，不會再貼邊不見。
function padAutoscale(series) {
  series.applyOptions({
    autoscaleInfoProvider: original => {
      const res = original();
      if (res && res.priceRange) {
        const { minValue, maxValue } = res.priceRange;
        const pad = (maxValue - minValue) * 0.08 || Math.abs(maxValue) * 0.01 || 1;
        res.priceRange = { minValue: minValue - pad, maxValue: maxValue + pad };
      }
      return res;
    },
  });
}

// 共用：在任一 series 上畫（或更新）「今高/今低」兩條固定水平線。lines 是呼叫端自己保管的
// { high, low } 物件，第一次建線後靠 applyOptions 更新價位，不用整條重畫。
function upsertHiLoLines(series, lines, high, low) {
  if (!lines.high) {
    lines.high = series.createPriceLine({
      price: high, color: '#f85149', lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: '今高',
    });
  } else {
    lines.high.applyOptions({ price: high });
  }
  if (!lines.low) {
    lines.low = series.createPriceLine({
      price: low, color: '#3fb950', lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: '今低',
    });
  } else {
    lines.low.applyOptions({ price: low });
  }
}
function renderHiLo() {
  document.getElementById('price-hilo').textContent =
    `今日最高 ${todayHigh.toFixed(2)}　最低 ${todayLow.toFixed(2)}`;

}
function appendTick(price) {
  if (chartPeriod !== '1m') return; // 5分K/日K不是逐筆折線，用固定資料重畫（見 loadIntraday），不能直接 update()
  const ts = taipeiMinuteTs(new Date());
  if (ts < lastChartTs) return; // 圖表時間必須非遞減；同分鐘內用 update() 覆蓋原點即可
  lastChartTs = ts;
  priceSeries.update({ time: ts, value: price });
  if (todayHigh == null || price > todayHigh) todayHigh = price;
  if (todayLow == null || price < todayLow) todayLow = price;
  renderHiLo();
  lockChartRange(priceChart);
}

let lastPrice = null;
let lastName = null;

let lastChangePrice = null;

// 預約單：只有目前有持倉的標的能設（顯示在該標的的持倉卡片底部）。市價單下一次報價就成交；
// 漲停/跌停/自訂價則等現價「觸碰」目標價才成交（下單當下目標價在現價之下就等跌到才觸發，
// 之上就等漲到才觸發，跟買賣方向無關），觸發時用當下報價當成交價，跟真實限價/停損單邏輯一致。
// 持倉平倉、卡片消失時，該標的還沒觸發的預約單一併作廢（見 destroyHoldingCard）。
function poPrevClose(code) {
  const h = holdingCharts[code];
  if (!h || h.price == null || h.changePrice == null) return null;
  return h.price - h.changePrice;
}
function resolvePendingTargetPrice(code, priceType, customVal) {
  if (priceType === 'market') return null; // null 代表市價，不用比價，下一次報價直接成交
  if (priceType === 'custom') return customVal;
  const prevClose = poPrevClose(code);
  if (prevClose == null) return null;
  return +(priceType === 'limitUp' ? prevClose * 1.1 : prevClose * 0.9).toFixed(2);
}
async function createPendingOrder(code, direction, qty, priceType, customVal) {
  const target = resolvePendingTargetPrice(code, priceType, customVal);
  if (priceType !== 'market' && target == null) { alert('目前還沒有報價，無法算出漲停/跌停價'); return; }
  let triggerDir = null;
  if (priceType !== 'market') {
    // 觸發方向要用「下單當下最新現價」判斷，不能吃 hcard 卡片的舊快取（最多可能是3秒前的價格，
    // 快市時足以讓漲跌判斷反過來，變成一送出就立刻成交）：這裡即時重抓一次報價再算。
    let currentPrice;
    try {
      const r = await fetch(`/api/quote?code=${encodeURIComponent(code)}`);
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '無法取得報價');
      currentPrice = d.price;
    } catch (e) { alert('目前還沒有報價，請稍後再試'); return; }
    // 目標價在現價之下 → 等現價跌到目標價才觸發；目標價在現價之上 → 等現價漲到目標價才觸發。
    triggerDir = target <= currentPrice ? 'down' : 'up';
  }
  STATE.pendingOrders.push({
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    code, direction, qty, priceType, target, triggerDir,
  });
  saveState();
  renderPendingOrdersFor(code);
}
function cancelPendingOrder(id) {
  const order = STATE.pendingOrders.find(o => o.id === id);
  STATE.pendingOrders = STATE.pendingOrders.filter(o => o.id !== id);
  saveState();
  if (order) renderPendingOrdersFor(order.code);
}
function poLabel(o) {
  if (o.priceType === 'market') return '市價';
  const t = { limitUp: '漲停', limitDown: '跌停', custom: '自訂' }[o.priceType] || o.priceType;
  return `${t} ${o.target.toFixed(2)}`;
}
function renderPendingOrdersFor(code) {
  const box = document.querySelector(`#hcard-${code} .hcard-po-list`);
  if (!box) return;
  const orders = STATE.pendingOrders.filter(o => o.code === code);
  box.innerHTML = orders.map(o => `
    <div class="po-row">
      <span class="${o.direction > 0 ? 'pos-up' : 'pos-down'}">${o.direction > 0 ? '買進' : '賣出'} ${o.qty}張 @ ${poLabel(o)}</span>
      <button type="button" class="po-cancel" data-id="${o.id}">取消</button>
    </div>`).join('');
}
function checkPendingOrders(code, currentPrice) {
  if (!STATE.pendingOrders.length) return;
  const due = STATE.pendingOrders.filter(o => o.code === code && (
    o.priceType === 'market'
      || (o.triggerDir === 'down' && currentPrice <= o.target)
      || (o.triggerDir === 'up' && currentPrice >= o.target)
  ));
  if (!due.length) return;
  STATE.pendingOrders = STATE.pendingOrders.filter(o => !due.includes(o));
  due.forEach(o => applyTradeFor(o.code, o.direction, o.qty * 1000, currentPrice));
  saveState();
  renderPendingOrdersFor(code);
}

function renderBidAsk(d) {

  const barPct = v => Math.max(3, Math.round(v / maxVol * 100));
  const bidTotal = d.bids.reduce((s, b) => s + b.volume, 0);
  const askTotal = d.asks.reduce((s, a) => s + a.volume, 0);
  const sumTotal = bidTotal + askTotal || 1;
  const bidPct = Math.round(bidTotal / sumTotal * 1000) / 10;
  const askPct = Math.round(askTotal / sumTotal * 1000) / 10;

    <div class="ba-row">

  const askRows = d.asks.map(a => `

      <span class="ba-vol">${a.volume.toLocaleString()}</span>
    </div>`).join('');

  body.innerHTML = `
    <div class="ba-ratio">
      <span class="pos-down">委買 ${bidPct}%</span>
      <div class="ba-ratio-track">
        <div class="ba-ratio-bid" style="width:${bidPct}%"></div>
        <div class="ba-ratio-ask" style="width:${askPct}%"></div>
      </div>
      <span class="pos-up">${askPct}% 委賣</span>
    </div>
    <div class="ba-cols">
      <div class="ba-col">
        <div class="ba-col-head">(${bidTotal.toLocaleString()})</div>
        ${bidRows}
      </div>
      <div class="ba-col">
        <div class="ba-col-head" style="text-align:right">(${askTotal.toLocaleString()})</div>
        ${askRows}
      </div>
    </div>`;
}

// direction: +1 買進, -1 賣出。用「部位(可正可負)+加權平均成本」單一模型統一處理多空與反手。
// code 可以是任何有部位的標的，不限於目前 active 顯示大圖的那一檔。
// 永豐證券大戶投 APP 電子交易costs：手續費 0.1425% × 2折（每筆最低1元），
// 當沖現股賣出證交稅減半 0.15%（買進不課稅）。
const FEE_RATE = 0.001425;
const FEE_DISCOUNT = 0.2;
const FEE_MIN = 1;
const TAX_RATE = 0.0015;
function calcFee(price, qty) { return Math.max(Math.round(price * qty * FEE_RATE * FEE_DISCOUNT), FEE_MIN); }

// 純部位/現金運算，不建立交易紀錄，重播歷史（刪單後重建帳面）跟正常下單共用同一套算法。
function applyTradePosition(code, direction, qty, price) {
  const posObj = ensurePosition(code);
  const pos = posObj.position, avg = posObj.avgCost;
  const signed = direction * qty;
  const fee = calcFee(price, qty);
  const tax = direction < 0 ? Math.round(price * qty * TAX_RATE) : 0; // 只有賣出課證交稅
  let realized = 0;

  if (pos === 0 || pos * signed >= 0) {
    // 加碼同方向部位：手續費併入成本，平均成本才反映真實持有成本
    const newPos = pos + signed;
    const costBasis = Math.abs(pos) * avg + qty * price + fee;
    posObj.avgCost = newPos !== 0 ? costBasis / Math.abs(newPos) : 0;
    posObj.position = newPos;
  } else {
    const closingQty = Math.min(qty, Math.abs(pos));
    const grossPnl = pos > 0 ? (price - avg) * closingQty : (avg - price) * closingQty;
    // 平倉部分按比例分攤這筆交易的手續費＋證交稅，已實現損益才是真正落袋的淨額
    const closeCost = (fee + tax) * (closingQty / qty);
    realized = grossPnl - closeCost;
    posObj.realizedPnl += realized;
    const remainder = qty - closingQty;
    if (remainder > 0) {
      const openFee = fee * (remainder / qty);
      posObj.position = direction * remainder;
      posObj.avgCost = price + openFee / remainder;
    } else {
      posObj.position = pos + signed;
      if (posObj.position === 0) posObj.avgCost = 0;
    }
  }
  STATE.cash -= signed * price;
  STATE.cash -= fee;
  STATE.cash -= tax;
  return { posObj, fee, tax, realized };
}

function applyTradeFor(code, direction, qty, price) {
  const { posObj, fee, tax, realized } = applyTradePosition(code, direction, qty, price);
  const tradeRecord = {
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    date: taipeiDateStr(new Date()),
    time: new Date().toLocaleTimeString('zh-TW'),
    code,
    name: posObj.name || code,
    action: direction > 0 ? '買進' : '賣出',
    price, qty, fee, tax, realized,
  };
  STATE.trades.push(tradeRecord);
  saveState();
  renderPortfolio();
  renderLog();
  syncHoldingCards();
  pendingTradeSync.set(tradeRecord.id, logTradeToServer(tradeRecord));
}

// trade.id -> 該筆成交同步到後端 SQLite 的 Promise，deleteTrade 要先等它跑完才知道 dbId，
// 不然剛下單就馬上刪的話 dbId 還沒回來，後端那筆會變孤兒資料，每日損益就對不起來。
const pendingTradeSync = new Map();

// 用剩下的交易紀錄由頭重播，重建現金與所有部位，跟刪掉那筆紀錄前後帳面完全一致。
function recomputeCashAndPositions() {
  STATE.cash = STATE.capital;
  STATE.positions = {};
  for (const t of STATE.trades) {
    const direction = t.action === '買進' ? 1 : -1;
    const { posObj } = applyTradePosition(t.code, direction, t.qty, t.price);
    posObj.name = t.name || t.code;
  }
}

async function deleteTrade(id) {
  const trade = STATE.trades.find(t => t.id === id);
  if (!trade) return;
  if (!confirm(`確定要刪除這筆紀錄？\n${trade.time} ${trade.code} ${trade.action} ${trade.qty}張 @ ${trade.price}\n現金/持倉/損益會還原到這筆交易發生前的狀態。`)) return;
  const pending = pendingTradeSync.get(id);
  if (pending) { await pending; pendingTradeSync.delete(id); } // 等後端同步完成，dbId 才會確定
  STATE.trades = STATE.trades.filter(t => t.id !== id);
  recomputeCashAndPositions();
  saveState();
  renderPortfolio();
  renderLog();
  syncHoldingCards();
  if (trade.dbId != null) deleteTradeFromServer(trade.dbId);
}

async function deleteTradeFromServer(dbId) {
  try {
    await fetch(`/api/trade_log/${dbId}`, { method: 'DELETE' });
    loadDailyPnl();
  } catch (e) { /* 後端同步失敗不影響本機帳面，下次補寫即可 */ }
}

// 每一筆成交都永久寫進後端 SQLite，不放進 localStorage（那份只是瀏覽器端的即時工作狀態，
// 重置模擬或清瀏覽器資料都會清掉）。這裡失敗不影響下單流程本身，只是這筆記錄暫時沒同步成功。
async function logTradeToServer(trade) {
  try {
    const r = await fetch('/api/trade_log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(trade),
    });
    const d = await r.json();
    if (d.ok) {
      trade.dbId = d.id; // 記住後端 row id，之後刪這筆紀錄才能一併刪掉後端資料
      saveState();
      loadDailyPnl();
    }
  } catch (e) { /* 網路問題：這筆損益紀錄同步失敗，但下單本身已經成功，不擋流程 */ }
}

// 以天結算的勝率：當天已實現損益（淨）> 0 算贏，< 0 算輸，剛好 0（有交易但沒賺沒賠）不計入分母。
function renderWinRate(days) {
  const el = document.getElementById('daily-winrate');
  const wins = days.filter(d => d.realized_pnl > 0).length;
  const losses = days.filter(d => d.realized_pnl < 0).length;
  const decided = wins + losses;
  el.textContent = decided
    ? `勝率 ${(wins / decided * 100).toFixed(1)}%（${wins}勝 ${losses}敗，共${days.length}天）`
    : '';
}

async function loadDailyPnl() {
  const body = document.getElementById('daily-pnl-body');

      return;
    }
    renderWinRate(d.days);
    const capital = STATE && STATE.capital ? STATE.capital : DEFAULT_CAPITAL;
    body.innerHTML = d.days.map(row => {
      const pct = capital ? (row.realized_pnl / capital * 100).toFixed(2) + '%' : '--';
      return `
      <tr>
        <td>${row.date}</td>
        <td>${row.trade_count}</td>
        <td>${fmtMoney(-(row.fee_total + row.tax_total))}</td>
        <td class="${upDownClass(row.realized_pnl)}">${fmtMoney(row.realized_pnl)}</td>
        <td class="${upDownClass(row.realized_pnl)}">${pct}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    document.getElementById('daily-winrate').textContent = '';
    body.innerHTML = '<tr class="empty-row"><td colspan="5">無法連線後端服務</td></tr>';
  }
}

async function flattenPosition(code) {
  const posObj = STATE.positions[code];
  if (!posObj || posObj.position === 0) return;
  let price = currentPriceFor(code);
  if (price == null) {
    try {
      const r = await fetch(`/api/quote?code=${encodeURIComponent(code)}`);
      const d = await r.json();
      if (d.ok) price = d.price;
    } catch (e) { /* 下面統一處理失敗 */ }
  }
  if (price == null) { alert('無法取得現價，平倉失敗，請稍後再試'); return; }
  applyTradeFor(code, posObj.position > 0 ? -1 : 1, Math.abs(posObj.position), price);
}

function destroyHoldingCard(code) {
  const h = holdingCharts[code];
  if (!h) return;
  clearInterval(h.pollTimer);
  const el = document.getElementById(`hcard-${code}`);
  if (el) el.remove();
  delete holdingCharts[code];
  // switchActive() 也會呼叫這裡把卡片拆掉重建（升級成大圖），這時部位還在，不能清單；
  // 只有真的平倉（position 歸零）才把還沒觸發的預約單作廢，避免變孤兒資料。
  const posObj = STATE.positions[code];
  const stillHeld = posObj && posObj.position !== 0;
  if (!stillHeld && STATE.pendingOrders.some(o => o.code === code)) {
    STATE.pendingOrders = STATE.pendingOrders.filter(o => o.code !== code);
    saveState();
  }
}

// 從交易紀錄回推「目前這個部位」是哪幾筆買進累積出來的：部位歸零就代表前面的買進已經跟現在無關，
// 重新開始算，這樣多空反手、分批加碼都不會混到已經平倉的舊紀錄。
function buyLotsForCode(code) {
  let pos = 0, lots = [];
  for (const t of STATE.trades) {
    if (t.code !== code) continue;
    if (pos === 0) lots = [];
    if (t.action === '買進') lots.push({ time: t.time, qty: t.qty });
    pos += (t.action === '買進' ? 1 : -1) * t.qty;
  }
  return lots;
}
function renderBuyLots(code) {
  const box = document.getElementById(`hcard-buys-${code}`);
  if (!box) return;
  const lots = buyLotsForCode(code);
  if (!lots.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="hcard-buys-label">買進紀錄</div>` + lots.map(l =>
    `<div class="hcard-buys-row">${l.time}　${(l.qty / 1000).toLocaleString()}張</div>`
  ).join('');
}

function updateHoldingCardStats(code) {
  const posObj = STATE.positions[code];
  const h = holdingCharts[code];
  if (!posObj || !h) return;
  const nameEl = document.querySelector(`#hcard-${code} .hcard-name`);
  if (nameEl) nameEl.textContent = `${code}${posObj.name ? ' ' + posObj.name : ''}`;
  const posEl = document.getElementById(`hcard-pos-${code}`);
  if (posEl) {
    const dir = posObj.position > 0 ? '多' : '空';
    posEl.textContent = `${dir} ${Math.abs(posObj.position).toLocaleString()}股 · 均價 ${posObj.avgCost.toFixed(2)}`;
    posEl.className = 'hcard-pos ' + upDownClass(posObj.position);
  }
  const priceEl = document.getElementById(`hcard-price-${code}`);
  if (priceEl && h.price != null) {
    const chg = h.changePrice;
    const chgTxt = chg == null ? '' : ` ${chg >= 0 ? '+' : ''}${chg.toFixed(2)} (${fmtPct(h.changeRate || 0)})`;
    priceEl.textContent = `${h.price.toFixed(2)}${chgTxt}`;
    priceEl.className = 'hcard-price ' + upDownClass(chg);
  }
  const pnlEl = document.getElementById(`hcard-pnl-${code}`);
  if (pnlEl && h.price != null) {
    const unrealized = (h.price - posObj.avgCost) * posObj.position;
    const cost = posObj.avgCost * Math.abs(posObj.position);
    const pct = cost ? (unrealized / cost * 100).toFixed(2) + '%' : '--';
    pnlEl.textContent = `${fmtMoney(unrealized)}（${pct}）`;
    pnlEl.className = 'hcard-pnl ' + upDownClass(unrealized);
  }
  renderBuyLots(code);
}

function createHoldingCard(code) {
  const posObj = ensurePosition(code);
  const card = document.createElement('div');
  card.className = 'hcard';
  card.id = `hcard-${code}`;
  card.innerHTML = `
    <div class="hcard-head">
      <div>
        <div class="hcard-name">${code}${posObj.name ? ' ' + posObj.name : ''}</div>
        <div class="hcard-pos" id="hcard-pos-${code}"></div>
        <div class="hcard-price" id="hcard-price-${code}">--</div>
      </div>
      <button class="flat" style="font-size:11px;padding:3px 8px">平倉</button>
    </div>
    <div class="hcard-chart" id="hchart-${code}"></div>
    <div class="hcard-pnl" id="hcard-pnl-${code}">--</div>
    <div class="hcard-buys" id="hcard-buys-${code}"></div>
    <div class="hcard-po">
      <div class="hcard-po-label">預約單</div>
      <div class="hcard-po-row">
        <button type="button" class="po-dir-btn buy active" data-dir="1">買進</button>
        <button type="button" class="po-dir-btn sell" data-dir="-1">賣出</button>
      </div>
      <div class="hcard-po-row">
        <input class="po-qty" type="number" placeholder="張數" min="1" step="1" value="1">
        <select class="po-type-select">
          <option value="market">市價</option>
          <option value="limitUp">漲停</option>
          <option value="limitDown">跌停</option>
          <option value="custom">自訂價</option>
        </select>
      </div>
      <div class="hcard-po-row">
        <input class="po-custom-price" type="number" step="0.05" placeholder="目標價" style="display:none">
      </div>
      <button type="button" class="po-submit">送出預約</button>
      <div class="hcard-po-list"></div>
    </div>`;
  card.querySelector('.flat').addEventListener('click', (e) => { e.stopPropagation(); flattenPosition(code); });
  card.addEventListener('click', () => {
    document.getElementById('code').value = code;
    switchActive(code);
    window.scrollTo({ top: document.querySelector('.layout').offsetTop - 10, behavior: 'smooth' });
  });
  const poWrap = card.querySelector('.hcard-po');
  poWrap.addEventListener('click', e => e.stopPropagation()); // 卡片本身點擊會切換作用中標的，預約單區塊要擋掉冒泡
  const dirBuy = poWrap.querySelector('.po-dir-btn[data-dir="1"]');
  const dirSell = poWrap.querySelector('.po-dir-btn[data-dir="-1"]');
  dirBuy.addEventListener('click', () => { dirBuy.classList.add('active'); dirSell.classList.remove('active'); });
  dirSell.addEventListener('click', () => { dirSell.classList.add('active'); dirBuy.classList.remove('active'); });
  const typeSelect = poWrap.querySelector('.po-type-select');
  const customInput = poWrap.querySelector('.po-custom-price');
  typeSelect.addEventListener('change', () => {
    customInput.style.display = typeSelect.value === 'custom' ? 'inline-block' : 'none';
  });
  poWrap.querySelector('.po-submit').addEventListener('click', () => {
    const direction = dirBuy.classList.contains('active') ? 1 : -1;
    const qty = parseFloat(poWrap.querySelector('.po-qty').value);
    const priceType = typeSelect.value;
    const customVal = parseFloat(customInput.value);
    if (!qty || qty <= 0) { alert('請輸入張數'); return; }
    if (priceType === 'custom' && !(customVal > 0)) { alert('請輸入自訂價格'); return; }
    createPendingOrder(code, direction, qty, priceType, customVal);
  });
  poWrap.querySelector('.hcard-po-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.po-cancel');
    if (btn) cancelPendingOrder(btn.dataset.id);
  });
  document.getElementById('holdings-grid').appendChild(card);

  const chartEl = document.getElementById(`hchart-${code}`);
  const miniChart = LightweightCharts.createChart(chartEl, {
    localization: { locale: 'zh-TW' },
    layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
    grid: { vertLines: { visible: false }, horzLines: { visible: false } },
    timeScale: { visible: false },
    rightPriceScale: { visible: false },
    handleScroll: false, handleScale: false,
    width: chartEl.clientWidth, height: 100,
  });
  const series = miniChart.addLineSeries({ color: '#58a6ff', lineWidth: 2, priceLineVisible: false });
  const vwapSeries = miniChart.addLineSeries({ color: '#e3b341', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  // scaleMargins 一定要在至少一個 series 掛上這個 price scale「之後」設定才會生效，
  // 掛之前呼叫會被第一個 series 綁定時重新初始化蓋掉（今高/今低剛好貼在資料極值上，
  // margins 沒吃到的話那兩條線會整個貼齊畫布邊緣，實際上看不到）。
  series.priceScale().applyOptions({ scaleMargins: { top: 0.2, bottom: 0.2 } });
  padAutoscale(series);
  holdingCharts[code] = {
    chart: miniChart, series, vwapSeries, lastTs: 0, price: null, pollTimer: null,
    high: null, low: null, hiLoLines: { high: null, low: null },
  };

  fetchIntradaySeries(code).then(data => {
    const h = holdingCharts[code];
    if (!h || !data.length) return;
    series.setData(data);
    h.lastTs = data[data.length - 1].time;
    h.high = Math.max(...data.map(p => p.value));
    h.low = Math.min(...data.map(p => p.value));
    upsertHiLoLines(series, h.hiLoLines, h.high, h.low);
    let cumPV = 0, cumVol = 0;
    vwapSeries.setData(data.map(pt => {
      cumPV += pt.value * pt.volume;
      cumVol += pt.volume;
      return { time: pt.time, value: cumVol > 0 ? +(cumPV / cumVol).toFixed(2) : pt.value };
    }));
    lockChartRange(miniChart);
  }).catch(() => {});

  const poll = async () => {
    const h = holdingCharts[code];
    if (!h) return; // 卡片可能已經在等待這次 fetch 期間被平倉移除
    try {
      const r = await fetch(`/api/quote?code=${encodeURIComponent(code)}`);
      const d = await r.json();
      if (!d.ok || !holdingCharts[code]) return;
      h.price = d.price;
      h.changePrice = d.change_price;
      h.changeRate = d.change_rate;
      if (d.name) posObj.name = d.name;
      const ts = taipeiMinuteTs(new Date());
      if (ts >= h.lastTs) { h.lastTs = ts; h.series.update({ time: ts, value: d.price }); }
      if (h.high == null || d.price > h.high) h.high = d.price;
      if (h.low == null || d.price < h.low) h.low = d.price;
      upsertHiLoLines(h.series, h.hiLoLines, h.high, h.low);
      lockChartRange(h.chart);
      updateHoldingCardStats(code);
      renderPortfolio();
      checkPendingOrders(code, d.price);
    } catch (e) { /* 忽略單次輪詢失敗 */ }
  };
  poll();
  holdingCharts[code].pollTimer = setInterval(poll, 3000);
  renderPendingOrdersFor(code); // 卡片剛建立時，把已經存在的預約單（例如重新整理後還原）先畫出來
  renderBuyLots(code);
}

function syncHoldingCards() {
  const heldCodes = Object.keys(STATE.positions).filter(c => STATE.positions[c].position !== 0);
  Object.keys(holdingCharts).forEach(code => { if (!heldCodes.includes(code)) destroyHoldingCard(code); });
  // 容器要先變成看得見的 display:block，卡片裡的 LightweightCharts 才能量到非 0 寬度；
  // 順序反過來的話 chartEl.clientWidth 會是 0，圖表畫布建出來寬度也是 0，線就完全不會顯示。
  document.getElementById('holdings-wrap').style.display = heldCodes.length ? 'block' : 'none';
  heldCodes.forEach(code => { if (!holdingCharts[code]) createHoldingCard(code); });
}

// 切換「作用中」標的：換掉大圖／五檔／下單面板的目標，但不動其他已持有部位。
async function switchActive(code) {
  destroyHoldingCard(code); // 如果這檔原本是庫存小卡，現在要升級成大圖，先拆掉小卡避免重複輪詢
  STATE.active = code;
  ensurePosition(code);
  saveState();
  document.getElementById('order-price').value = ''; // 換標的，之前選的價位不該沿用，改回市價
  lastPrice = null;
  lastName = null;
  lastChartTs = 0;
  todayHigh = null; todayLow = null;
  document.getElementById('price-hilo').textContent = '';
  document.getElementById('btn-buy').disabled = false;
  document.getElementById('btn-sell').disabled = false;
  initChart();
  await loadIntraday(code); // 先把歷史分K畫完，避免跟第一次即時報價的 update() 搶時間軸順序
  renderPortfolio();
  renderLog();
  syncHoldingCards();
  if (pollTimer) clearInterval(pollTimer);
  pollTick();
  pollTimer = setInterval(pollTick, 1500);
}

async function resolveCode(input) {
  if (/^\d{4}$/.test(input)) return input;
  try {
    const r = await fetch(`/api/stock_search?q=${encodeURIComponent(input)}`);
    const d = await r.json();
    if (d.ok && d.results.length) return d.results[0].code;
  } catch (e) { /* 查不到就照原字串走，讓後面的報價 API 自然回錯誤訊息 */ }
  return input;
}

let searchDebounce = null;
function initCodeSearch() {
  const input = document.getElementById('code');
  const box = document.getElementById('code-suggest');
  input.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    const q = input.value.trim();
    if (!q || /^\d{4}$/.test(q)) { box.classList.remove('show'); return; }
    searchDebounce = setTimeout(async () => {
      try {
        const r = await fetch(`/api/stock_search?q=${encodeURIComponent(q)}`);
        const d = await r.json();
        if (!d.ok || !d.results.length) { box.classList.remove('show'); return; }
        box.innerHTML = d.results.map(s =>
          `<div data-code="${s.code}"><span class="sg-code">${s.code}</span>${s.name}</div>`
        ).join('');
        box.classList.add('show');
      } catch (e) { box.classList.remove('show'); }
    }, 250);
  });
  box.addEventListener('click', (e) => {
    const row = e.target.closest('[data-code]');
    if (!row) return;
    input.value = row.dataset.code;
    box.classList.remove('show');
  });
  document.addEventListener('click', (e) => {
    if (e.target !== input && !box.contains(e.target)) box.classList.remove('show');
  });
}

async function startSim() {
  const raw = document.getElementById('code').value.trim();
  if (!raw) { alert('請輸入股票代號'); return; }
  const code = await resolveCode(raw);
  document.getElementById('code').value = code;
  document.getElementById('code-suggest').classList.remove('show');

  if (!STATE) {
    STATE = freshState(DEFAULT_CAPITAL);
    saveState();
  }
  await switchActive(code);
}

function resetSim() {
  Object.keys(holdingCharts).forEach(destroyHoldingCard);
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
  STATE = null;
  localStorage.removeItem(STORAGE_KEY);
  lastPrice = null; lastName = null; lastChartTs = 0;
  todayHigh = null; todayLow = null;
  document.getElementById('price-hilo').textContent = '';

  document.getElementById('code').value = '';
  document.getElementById('order-price').value = '';
  document.getElementById('btn-buy').disabled = true;
  document.getElementById('btn-sell').disabled = true;
  document.getElementById('btn-flat').disabled = true;
  document.getElementById('price-code').textContent = '—';
  document.getElementById('price-now').textContent = '--';
  document.getElementById('price-change').textContent = '';
  document.getElementById('price-meta').textContent = '尚未開始模擬';
  document.getElementById('chart-price').innerHTML = '';
  document.getElementById('chart-macd').innerHTML = '';
  document.getElementById('chart-empty').style.display = 'block';
  document.getElementById('bidask-body').innerHTML = '<div id="bidask-empty">尚未開始模擬</div>';
  document.getElementById('holdings-wrap').style.display = 'none';
  document.getElementById('holdings-grid').innerHTML = '';
  document.getElementById('log-body').innerHTML = '<tr class="empty-row"><td colspan="8">尚無交易</td></tr>';
}

// 下單價格：預設用市價（lastPrice）；使用者點五檔某個價位或自己輸入後改用那個價格下單，
// 按「市價」按鈕或把欄位清空可以改回用市價。
function getOrderPrice() {
  const v = parseFloat(document.getElementById('order-price').value);
  return (v && v > 0) ? v : lastPrice;
}

document.getElementById('bidask-body').addEventListener('click', (e) => {
  const el = e.target.closest('.ba-price');
  if (!el || !el.dataset.price) return;
  document.getElementById('order-price').value = el.dataset.price;
});
document.getElementById('btn-clear-price').addEventListener('click', () => {
  document.getElementById('order-price').value = '';
});

document.getElementById('btn-start').addEventListener('click', startSim);
document.getElementById('btn-reset').addEventListener('click', resetSim);
document.getElementById('btn-buy').addEventListener('click', () => {
  const lots = parseFloat(document.getElementById('qty').value);
  const price = getOrderPrice();
  if (!lots || lots <= 0 || price == null || !STATE || !STATE.active) return;
  applyTradeFor(STATE.active, 1, Math.round(lots * 1000), price);
});
document.getElementById('btn-sell').addEventListener('click', () => {
  const lots = parseFloat(document.getElementById('qty').value);
  const price = getOrderPrice();
  if (!lots || lots <= 0 || price == null || !STATE || !STATE.active) return;
  applyTradeFor(STATE.active, -1, Math.round(lots * 1000), price);
});
document.getElementById('btn-flat').addEventListener('click', () => {
  if (!STATE || !STATE.active) return;
  flattenPosition(STATE.active);
});

function moverRow(r, cls) {
  const div = document.createElement('div');
  div.className = 'mover-row';
  const chgTxt = r.change_price == null ? ''
    : `${r.change_price >= 0 ? '+' : ''}${r.change_price.toFixed(2)} `;
  div.innerHTML = `
    <span class="m-code">${r.code}</span>
    <span class="m-name">${r.name}</span>
    <span class="m-price ${cls}">${r.price.toFixed(2)}</span>
    <span class="m-rate ${cls}">${chgTxt}(${r.change_rate >= 0 ? '+' : ''}${r.change_rate.toFixed(2)}%)</span>
    <span class="m-vol">${r.volume.toLocaleString()}張</span>`;
  div.addEventListener('click', () => {
    document.getElementById('code').value = r.code;
    startSim();
    window.scrollTo({ top: document.querySelector('.layout').offsetTop - 10, behavior: 'smooth' });
  });
  return div;
}

async function loadMovers(fresh) {
  const btn = document.getElementById('movers-refresh');
  if (fresh) btn.disabled = true;
  try {
    const r = await fetch('/api/movers' + (fresh ? '?fresh=1' : ''));
    const d = await r.json();
    const upEl = document.getElementById('movers-up');
    const downEl = document.getElementById('movers-down');
    if (!d.ok) {
      document.getElementById('movers-updated').textContent = d.error || '載入失敗';
      upEl.innerHTML = downEl.innerHTML = '<div class="empty-row" style="padding:12px 0;color:#8b949e">無資料</div>';
      return;
    }
    document.getElementById('movers-updated').textContent =
      `成交量排行更新於 ${new Date(d.updated_at).toLocaleTimeString('zh-TW')}`;

    upEl.innerHTML = '';
    if (!d.gainers.length) upEl.innerHTML = '<div class="empty-row" style="padding:12px 0;color:#8b949e">目前無符合條件個股</div>';
    else d.gainers.forEach(row => upEl.appendChild(moverRow(row, 'pos-up')));

    downEl.innerHTML = '';
    if (!d.losers.length) downEl.innerHTML = '<div class="empty-row" style="padding:12px 0;color:#8b949e">目前無符合條件個股</div>';
    else d.losers.forEach(row => downEl.appendChild(moverRow(row, 'pos-down')));
  } catch (e) {
    document.getElementById('movers-updated').textContent = '無法連線後端服務';
  } finally {
    if (fresh) btn.disabled = false;
  }
}

async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    setGwStatus(!!d.ok);
  } catch (e) { setGwStatus(false); }
}

document.getElementById('movers-refresh').addEventListener('click', () => loadMovers(true));

document.querySelectorAll('.period-btn[data-period]').forEach(btn => {
  btn.addEventListener('click', async () => {
    if (btn.dataset.period === chartPeriod || !STATE || !STATE.active) return;
    document.querySelectorAll('.period-btn[data-period]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    chartPeriod = btn.dataset.period;
    initChart();
    await loadIntraday(STATE.active);
  });
});

// 均線開關：1分K本來就不畫均線，按鈕停用；5分K/日K可切換三條MA線的顯示/隱藏
let maEnabled = true;
function updateMAToggleBtn() {
  const btn = document.getElementById('ma-toggle-btn');
  const disabled = chartPeriod === '1m' || chartPeriod === 'wave';
  btn.textContent = maEnabled ? '均線 開' : '均線 關';
  btn.classList.toggle('active', !disabled && maEnabled);
  btn.style.opacity = disabled ? 0.3 : (maEnabled ? 1 : 0.5);
  btn.style.pointerEvents = disabled ? 'none' : 'auto';
}
document.getElementById('ma-toggle-btn').addEventListener('click', () => {
  if (chartPeriod === '1m' || chartPeriod === 'wave') return;
  maEnabled = !maEnabled;
  [ma5Series, ma10Series, ma20Series].forEach(s => s && s.applyOptions({ visible: maEnabled }));
  updateMAToggleBtn();
});

(async function boot() {
  checkHealth();
  loadMovers();
  loadDailyPnl();
  initCodeSearch();
  initIndexChart();
  setInterval(loadMovers, 30000);
  setInterval(() => { if (STATE && STATE.active) loadIntraday(STATE.active); }, 30000); // 依目前週期補上最新K棒（分K成交量／5分K／日K）
  const saved = loadState();
  if (saved) {
    STATE = saved;
    if (STATE.active) {
      document.getElementById('code').value = STATE.active;
      document.getElementById('btn-buy').disabled = false;
      document.getElementById('btn-sell').disabled = false;
      initChart();
      await loadIntraday(STATE.active);
      pollTick();
      pollTimer = setInterval(pollTick, 1500);
    }
    renderPortfolio();
    renderLog();
    syncHoldingCards();
  }
})();
</script>
