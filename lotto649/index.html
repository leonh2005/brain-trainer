    /* ── 號碼球 ── */
    .ball {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%;
      background: #7ba828; color: #fff;
      font-family: Arial, sans-serif; font-size: 13px; font-weight: 700;
      margin: 3px; user-select: none;
    }
    .ball.chosen { background: #e07820; }

    /* ── 票券列 ── */

                 box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 14px; }

    .stat-label { color: #888; margin-right: 4px; }
    .combo-row { display: flex; align-items: center; flex-wrap: wrap;
                 background: #fff; border-radius: 10px; padding: 8px 12px;
                 box-shadow: 0 1px 3px rgba(0,0,0,.07); margin-bottom: 8px; }
    .combo-idx { color: #adb5bd; font-size: .82rem; min-width: 28px; flex-shrink: 0; }
    .extra-note { font-size: .88rem; color: #6c757d; margin-top: 10px;
                  background: #fff3cd; border-radius: 8px; padding: 8px 14px; }

    .num-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0; }
    .num-btn {
      aspect-ratio: 1; border-radius: 50%; border: 2px solid #dee2e6;
      background: #fff; color: #495057; font-weight: 700; font-size: 13px;
      cursor: pointer; transition: all .15s; display: flex;
      align-items: center; justify-content: center;
    }
    .num-btn:hover { border-color: #7ba828; color: #7ba828; }
    .num-btn.selected { background: #e07820; border-color: #e07820; color: #fff; }
    .num-btn.selected:hover { background: #c0601a; border-color: #c0601a; }
    .num-btn:disabled { opacity: .35; cursor: not-allowed; }
    .guarantee-badge {
      display: inline-block; background: #198754; color: #fff;
      border-radius: 20px; padding: 4px 12px; font-size: .82rem; font-weight: 600;
    }
    .hint-box { background: #e8f5e9; border-left: 3px solid #4caf50;
                border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: .88rem;
                color: #2e7d32; margin-bottom: 14px; line-height: 1.6; }
    .warning-box { background: #fff8e1; border-left: 3px solid #ffc107;
                   border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: .88rem;
                   color: #6d4c00; margin-bottom: 14px; line-height: 1.6; }

</head>
<body>
<div class="page-wrap">
  <div class="text-center mb-3">
    <h2>大樂透選號產生器</h2>
    <div class="subtitle">包牌法・中5保5聰明包牌</div>
  </div>

  <!-- Tab -->
  <ul class="nav nav-tabs mb-3" id="mainTab">
    <li class="nav-item">

    </li>
    <li class="nav-item">

    </li>
  </ul>

  <!-- ══════════ 包牌法 ══════════ -->
  <div id="panel-classic">
    <div class="mb-3">

    </div>
    <div id="statsBox" class="stats-box" style="display:none"></div>
    <div class="mb-3 d-flex gap-2">

  <div id="panel-g55" style="display:none">

      系統自動套用數學覆蓋公式，<br>
      保證「只要開出的 6 個獎號全部落在你選的號碼裡，必中至少一注三獎（5碼）以上」。
    </div>

    <!-- N 選擇 -->
    <div class="mb-3">

      </div>
      <div id="nDesc" style="font-size:.8rem;color:#6c757d"></div>
    </div>

    <div class="num-grid" id="numGrid"></div>

    <div class="mb-3 d-flex gap-2 flex-wrap">
      <button class="btn btn-outline-danger btn-sm" onclick="clearSelection()">清除</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="randomFill()">隨機補齊</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="randomAll()">全部隨機</button>
    </div>

    <div id="g55Result"></div>
  </div>

<script>

//  共用
// ══════════════════════════════════════════════════
const TICKET_PRICE = 50;
const POOL_SIZE = 49;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function ballHtml(n, cls = '') {
  return `<span class="ball ${cls}">${String(n).padStart(2,'0')}</span>`;
}

function switchTab(tab) {
  document.getElementById('panel-classic').style.display = tab === 'classic' ? '' : 'none';
  document.getElementById('panel-g55').style.display    = tab === 'g55'     ? '' : 'none';
  document.getElementById('tab-classic').classList.toggle('active', tab === 'classic');
  document.getElementById('tab-g55').classList.toggle('active', tab === 'g55');
}

// ══════════════════════════════════════════════════

// ══════════════════════════════════════════════════

    ]

const DEFAULT_POOL = Array.from({length: POOL_SIZE}, (_, i) => i + 1);
let pool = [...DEFAULT_POOL];
let selectedOption = OPTIONS[1];

function renderStats() {
  const opt = selectedOption;
  const total = opt.combos.length * TICKET_PRICE;
  let h = `<div class="stat-line"><span class="stat-label">投注金額</span>${total.toLocaleString()} 元</div>`;
  if (opt.odds && opt.odds < 1)
    h += `<div class="stat-line"><span class="stat-label">中獎機率</span>${(opt.odds*100).toFixed(2)}%</div>`;
  if (opt.breakEven)
    h += `<div class="stat-line"><span class="stat-label">回本機率</span>${(opt.breakEven*100).toFixed(3)}%</div>`;
  if (opt.guaranteed)
    h += `<div class="stat-line"><span class="stat-label">保底獎金</span>${opt.guaranteed.toLocaleString()} 元</div>`;
  if (opt.guaranteed)
    h += `<div class="stat-line"><span class="stat-label">保底比例</span>${(opt.guaranteed/total*100).toFixed(2)}%</div>`;
  document.getElementById('statsBox').innerHTML = h;
  document.getElementById('statsBox').style.display = '';
}

function renderCombos() {
  const opt = selectedOption;
  let h = '';
  const usedIdx = new Set(opt.combos.flat());
  const unusedNums = [];
  for (let i = 0; i < POOL_SIZE; i++)
    if (!usedIdx.has(i)) unusedNums.push(pool[i]);

  opt.combos.forEach((combo, ci) => {
    const nums = combo.map(i => pool[i]).sort((a,b) => a-b);
    h += `<div class="combo-row"><span class="combo-idx">${ci+1}.</span>
      ${nums.map(n => ballHtml(n)).join('')}</div>`;
  });

  if (opt.combos.length === 8 && unusedNums.length > 0)
    h += `<div class="extra-note">未選到的號碼：<strong>${unusedNums.map(n=>String(n).padStart(2,'0')).join('、')}</strong></div>`;

  document.getElementById('combosDisplay').innerHTML = h;
}

function renderClassic() { renderStats(); renderCombos(); }

const sel = document.getElementById('optionSelect');
OPTIONS.forEach((opt, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = opt.name; sel.appendChild(o);
});
sel.value = 1;
sel.addEventListener('change', () => {
  selectedOption = OPTIONS[+sel.value]; pool = [...DEFAULT_POOL]; renderClassic();
});
document.getElementById('btnShuffle').addEventListener('click', () => {
  pool = shuffle(DEFAULT_POOL); renderClassic();
});
document.getElementById('btnReset').addEventListener('click', () => {
  pool = [...DEFAULT_POOL]; renderClassic();
});
renderClassic();

};

let g55N = 9;
let chosen = []; // sorted array of selected numbers (1-49)

function setN(n) {
  g55N = n;
  [6,7,8,9,10].forEach(v => {
    const btn = document.getElementById(`btnN${v}`);
    if (btn) {
      btn.classList.toggle('btn-primary', n === v);
      btn.classList.toggle('btn-outline-secondary', n !== v);
    }
  });
  const desc = document.getElementById('nDesc');
  if (desc) desc.textContent = N_DESC[n] || '';
  // 若已選超過上限則截斷
  if (chosen.length > n) { chosen = chosen.slice(0, n); updateNumGrid(); }
  updateG55Status();
  renderG55();
}

function buildNumGrid() {
  const grid = document.getElementById('numGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 49; i++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.id = `nb_${i}`;
    btn.textContent = String(i).padStart(2,'0');
    btn.onclick = () => toggleNum(i);
    grid.appendChild(btn);
  }
}

function updateNumGrid() {
  for (let i = 1; i <= 49; i++) {
    const btn = document.getElementById(`nb_${i}`);
    const isChosen = chosen.includes(i);
    btn.classList.toggle('selected', isChosen);
    btn.disabled = !isChosen && chosen.length >= g55N;
  }
}

function toggleNum(n) {
  const idx = chosen.indexOf(n);
  if (idx >= 0) {
    chosen.splice(idx, 1);
  } else {
    if (chosen.length >= g55N) return;
    chosen.push(n);
    chosen.sort((a,b) => a-b);
  }
  updateNumGrid();
  updateG55Status();
  renderG55();
}

function clearSelection() {
  chosen = []; updateNumGrid(); updateG55Status(); renderG55();
}

function randomFill() {
  const remaining = g55N - chosen.length;
  if (remaining <= 0) return;
  const pool = Array.from({length:49}, (_,i) => i+1).filter(n => !chosen.includes(n));
  const picks = shuffle(pool).slice(0, remaining);
  chosen = [...chosen, ...picks].sort((a,b) => a-b);
  updateNumGrid(); updateG55Status(); renderG55();
}

function randomAll() {
  const all = Array.from({length:49}, (_,i) => i+1);
  chosen = shuffle(all).slice(0, g55N).sort((a,b) => a-b);
  updateNumGrid(); updateG55Status(); renderG55();
}

function updateG55Status() {
  const st = document.getElementById('g55Status');
  const remaining = g55N - chosen.length;
  if (remaining > 0)
    st.textContent = `還需選 ${remaining} 個`;
  else
    st.textContent = `✅ 已選好 ${g55N} 個號碼`;
  st.style.color = remaining > 0 ? '#888' : '#198754';
}

function renderG55() {
  const el = document.getElementById('g55Result');
  if (chosen.length < g55N) { el.innerHTML = ''; return; }

  const template = COVERS[g55N];
  const cost = template.length * TICKET_PRICE;

  // 機率說明
  const p_all_in = N_PROB[g55N] || '';

  let h = `
    <div class="stats-box">
      <div class="stat-line"><span class="stat-label">你選的號碼</span>
        ${chosen.map(n => `<span class="ball chosen">${String(n).padStart(2,'0')}</span>`).join('')}
      </div>
      <div class="stat-line" style="margin-top:8px">
        <span class="stat-label">票數</span>${template.length} 注
        &nbsp;│&nbsp;
        <span class="stat-label">投注金額</span>${cost.toLocaleString()} 元
      </div>
      <div class="stat-line">
        <span class="stat-label">保證</span>
        <span class="guarantee-badge">6 獎號全落在選號內 → 必中至少一注三獎</span>
      </div>
      <div class="stat-line" style="color:#888;font-size:.82rem;margin-top:4px">
        6 獎號恰好全在你選的 ${g55N} 個號碼內的機率：${p_all_in}
      </div>
    </div>
    <div class="warning-box">
      💡 <strong>注意：</strong>此保證只在「開出的 6 個號碼全部都在你選的 ${g55N} 個號碼內」時生效。<br>
      若有任一獎號落在你未選的號碼，此保證不適用。
    </div>
  `;

  // QR Code 按鈕
  h += `<div class="mb-3 mt-1">
    <button class="btn btn-success btn-sm" onclick="openQR()">
      📷 產生 QR Code（逐注掃描填單）
    </button>
  </div>`;

  // 票券列表
  template.forEach((combo, ci) => {
    const nums = combo.map(i => chosen[i]).sort((a,b) => a-b);
    h += `<div class="combo-row"><span class="combo-idx">${ci+1}.</span>
      ${nums.map(n => ballHtml(n, 'chosen')).join('')}</div>`;
  });

  el.innerHTML = h;
}

// ══════════════════════════════════════════════════
//  QR Code 功能
// ══════════════════════════════════════════════════
let _qrTickets = [];   // [{idx, nums}]
let _qrCurrent = 0;
let _qrViewAll = false;

function openQR() {
  const template = COVERS[g55N];
  _qrTickets = template.map((combo, ci) => ({
    idx: ci + 1,
    nums: combo.map(i => chosen[i]).sort((a,b) => a-b)
  }));
  _qrCurrent = 0;
  _qrViewAll = false;
  document.getElementById('qrSingle').style.display = '';
  document.getElementById('qrAll').style.display = 'none';
  document.getElementById('qrViewLabel').textContent = '切換全覽';

  const modal = new bootstrap.Modal(document.getElementById('qrModal'));
  modal.show();
  document.getElementById('qrModal').addEventListener('shown.bs.modal', () => {
    drawQR(_qrCurrent);
  }, { once: true });
}

function drawQR(idx) {
  const t = _qrTickets[idx];
  const text = t.nums.map(n => String(n).padStart(2,'0')).join('  ');
  const canvas = document.getElementById('qrCanvas');
  QRCode.toCanvas(canvas, `大樂透 第${t.idx}注\n${text}`, {
    width: 220, margin: 2,
    color: { dark: '#1a1a1a', light: '#ffffff' }
  });
  document.getElementById('qrNumbers').innerHTML =
    t.nums.map(n => `<span class="ball chosen" style="width:34px;height:34px;font-size:13px">${String(n).padStart(2,'0')}</span>`).join('');
  document.getElementById('qrProgress').textContent =
    `第 ${t.idx} 注 / 共 ${_qrTickets.length} 注`;
}

function qrNext() {
  _qrCurrent = (_qrCurrent + 1) % _qrTickets.length;
  drawQR(_qrCurrent);
}

function qrPrev() {
  _qrCurrent = (_qrCurrent - 1 + _qrTickets.length) % _qrTickets.length;
  drawQR(_qrCurrent);
}

function toggleQrView() {
  _qrViewAll = !_qrViewAll;
  document.getElementById('qrSingle').style.display = _qrViewAll ? 'none' : '';
  document.getElementById('qrAll').style.display    = _qrViewAll ? '' : 'none';
  document.getElementById('qrViewLabel').textContent = _qrViewAll ? '切換單注' : '切換全覽';

  if (_qrViewAll) {
    const grid = document.getElementById('qrGrid');
    grid.innerHTML = '';
    _qrTickets.forEach((t, i) => {
      const cell = document.createElement('div');
      cell.style.textAlign = 'center';
      const cvs = document.createElement('canvas');
      cvs.style.width = '100%';
      cvs.style.cursor = 'pointer';
      cvs.onclick = () => { _qrViewAll = false; _qrCurrent = i; toggleQrView(); drawQR(i); };
      cell.appendChild(cvs);
      const label = document.createElement('div');
      label.style.cssText = 'font-size:.75rem;margin-top:3px;color:#555;font-weight:600';
      label.textContent = `第${t.idx}注`;
      cell.appendChild(label);
      const nums = document.createElement('div');
      nums.style.cssText = 'font-size:.65rem;color:#888;letter-spacing:1px';
      nums.textContent = t.nums.map(n=>String(n).padStart(2,'0')).join(' ');
      cell.appendChild(nums);
      grid.appendChild(cell);
      QRCode.toCanvas(cvs, t.nums.map(n=>String(n).padStart(2,'0')).join(' '), {
        width: 100, margin: 1, color: { dark: '#1a1a1a', light: '#ffffff' }
      });
    });
  }
}

// 初始化
buildNumGrid();
setN(9);
</script>
