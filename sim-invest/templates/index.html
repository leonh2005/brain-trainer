<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模擬投資儀表板</title>
<style>
:root{
  --bg:#f7f2e4; --bg-soft:#f0e9d6; --card:#fffdf7; --card-hover:#fbf7ec;
  --border:#ddd4bd; --border-soft:#e8e0cb;
  --fg:#141413; --muted:#73716a; --faint:#a8a599;
  --up:#c15f3c; --down:#5f7346;         /* 台股：紅漲綠跌 */
  --accent:#d97757; --accent-soft:#c15f3c;
  --radius:14px; --radius-sm:9px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,"PingFang TC","Segoe UI",sans-serif;
  font-size:13.5px; line-height:1.5; letter-spacing:-.005em;
  min-height:100vh; padding:22px 26px 60px;
  background-image:
    radial-gradient(900px 500px at 12% -8%, rgba(217,119,87,.09), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(106,155,204,.06), transparent 55%);
  background-attachment:fixed;
}
.wrap{max-width:1080px; margin:0 auto}
header{display:flex; align-items:center; gap:14px; margin-bottom:20px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:11px}
.brand .logo{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(140deg,var(--accent),var(--accent-soft));
  display:grid; place-items:center; font-size:17px; color:#fff;
  box-shadow:0 6px 16px -6px rgba(217,119,87,.55);
}
.brand h1{font-size:16px; font-weight:600; letter-spacing:-.02em}
.brand .sub{font-size:11px; color:var(--faint); font-weight:400}
.acct-switch{margin-left:auto; display:flex; gap:6px}
.acct-btn{
  padding:8px 16px; border-radius:999px; border:1px solid var(--border-soft);
  background:var(--card); color:var(--muted); font-size:12.5px; font-weight:600;
  cursor:pointer; transition:.15s;
}
.acct-btn:hover{border-color:var(--accent); color:var(--fg)}
.acct-btn.active{background:var(--accent); border-color:var(--accent); color:#fff}

.sec-label{
  display:flex; align-items:center; gap:9px; margin:24px 2px 12px;
  font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.09em; color:var(--faint);
}
.sec-label::after{content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--border),transparent)}

.card{
  background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:16px 18px; box-shadow:0 1px 2px rgba(20,20,19,.04), 0 4px 14px -8px rgba(20,20,19,.08);
}
.card + .card{margin-top:14px}
.card-head{display:flex; align-items:center; gap:8px; margin-bottom:12px}
.card-head .ic{font-size:14px}
.card-head h3{font-size:12.5px; font-weight:600; letter-spacing:-.01em}
.card-head .meta{margin-left:auto; font-size:11px; color:var(--faint); font-family:var(--mono)}
.refresh-btn{margin-left:10px; padding:5px 12px; border-radius:999px; border:1px solid var(--border-soft); background:var(--card); color:var(--muted); font-size:11.5px; font-weight:600; cursor:pointer; transition:.15s}
.refresh-btn:hover{border-color:var(--accent); color:var(--fg)}
.refresh-btn:disabled{opacity:.5; cursor:default}

table{width:100%; border-collapse:collapse; font-size:12.5px}
th{
  text-align:right; font-size:10.5px; font-weight:600; color:var(--faint);
  text-transform:uppercase; letter-spacing:.05em; padding:6px 8px; border-bottom:1px solid var(--border-soft);
}
th:first-child, td:first-child{text-align:left}
td{padding:9px 8px; border-bottom:1px solid var(--border-soft); font-family:var(--mono); text-align:right}
tr:last-child td{border-bottom:0}
td.name{font-family:-apple-system,sans-serif; font-weight:600; color:var(--fg)}
tr.total-row td{font-weight:700; border-top:2px solid var(--border); background:var(--bg-soft)}
td .cat{display:block; font-size:10px; color:var(--faint); font-weight:400; font-family:-apple-system,sans-serif}
.up{color:var(--up)} .down{color:var(--down)}

.empty{color:var(--faint); font-size:12px; padding:6px 0}
.badge{
  font-size:10px; padding:2px 8px; border-radius:6px; font-weight:600; font-family:var(--mono);
  display:inline-block;
}
.badge.drift{background:rgba(217,119,87,.14); color:var(--accent-soft)}
.badge.sat{background:rgba(95,115,70,.14); color:var(--down)}

.reb-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-soft)}
.reb-row:last-child{border-bottom:0}
.reb-row .txt{font-size:12px; color:var(--fg)}
.reb-row .txt b{font-weight:600}

.dca-grid{display:flex; gap:22px; flex-wrap:wrap; align-items:center}
.dca-stat{font-family:var(--mono)}
.dca-stat .n{font-size:22px; font-weight:600; color:var(--accent)}
.dca-stat .lbl{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
.dca-note{font-size:11.5px; color:var(--muted); flex:1; min-width:220px}

.err{color:var(--up); font-size:11px; font-family:var(--mono); padding:10px 0}

.edit-ic{background:none; border:none; cursor:pointer; font-size:12px; opacity:.6; padding:2px 4px}
.edit-ic:hover{opacity:1}
.cap-edit{display:inline-flex; align-items:center; gap:6px}
.cap-edit input{width:120px; font-family:var(--mono); font-size:12.5px; padding:4px 6px; border:1px solid var(--border); border-radius:6px}
.mini-btn{padding:4px 10px; border-radius:6px; border:1px solid var(--border-soft); background:var(--card); font-size:11.5px; cursor:pointer}
.mini-btn.save{background:var(--accent); border-color:var(--accent); color:#fff}
td input, td select{font-family:var(--mono); font-size:12px; padding:4px 6px; border:1px solid var(--border); border-radius:6px; width:100%}
td.actions{white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">📈</div>
      <div>
        <h1>模擬投資儀表板</h1>
        <div class="sub"><span id="acctName">載入中…</span> <button class="edit-ic" id="editCapBtn" title="修改本金">✏️</button></div>
        <div class="sub" id="acctPnl" style="margin-top:3px;font-weight:600"></div>
        <div class="sub" id="acctRealizedPnl" style="margin-top:2px"></div>
      </div>
    </div>
    <div class="acct-switch" id="acctSwitch"></div>
  </header>

  <div class="sec-label">配置總表</div>
  <div class="card">
    <div class="card-head"><span class="ic">📊</span><h3>目標 vs 實際配置</h3><span class="meta" id="allocMeta"></span><button id="refreshBtn" class="refresh-btn">🔄 刷新報價</button></div>
    <div class="card-body" id="allocTable"><div class="empty">載入中…</div></div>
  </div>

  <div class="sec-label">目標管理</div>
  <div class="card">
    <div class="card-head"><span class="ic">🎯</span><h3>編輯配置目標</h3><button id="addTargetBtn" class="refresh-btn">+ 新增標的</button></div>
    <div class="card-body" id="targetMgmtTable"><div class="empty">載入中…</div></div>
  </div>

  <div class="sec-label">淨值曲線</div>
  <div class="card">
    <div class="card-head"><span class="ic">📉</span><h3>NAV</h3><span class="meta" id="navMeta"></span></div>
    <div class="card-body" id="navChart"><div class="empty">載入中…</div></div>
  </div>

  <div class="sec-label">DCA 進度</div>
  <div class="card">
    <div class="card-head"><span class="ic">🗓️</span><h3>定期定額</h3></div>
    <div class="card-body dca-grid" id="dcaBody"><div class="empty">載入中…</div></div>
  </div>

  <div class="sec-label">再平衡警示</div>
  <div class="card" id="rebalCard">
    <div class="card-head"><span class="ic">⚖️</span><h3>再平衡訊號</h3></div>
    <div class="card-body" id="rebalBody"><div class="empty">載入中…</div></div>
  </div>
</div>

<script>
let currentAid = 'A';
let accountsData = [];

function fmt(n, digits){
  if (n === null || n === undefined || isNaN(n)) return '—';
  digits = digits === undefined ? 0 : digits;
  return n.toLocaleString('zh-TW', {minimumFractionDigits: digits, maximumFractionDigits: digits});
}
function pct(n){ return fmt(n, 2) + '%'; }
function signClass(n){ return n > 0 ? 'up' : (n < 0 ? 'down' : ''); }
function sign(n){ return n > 0 ? '+' : ''; }

async function loadAccounts(){
  const res = await fetch('/api/accounts');
  accountsData = await res.json();
  const sw = document.getElementById('acctSwitch');
  sw.innerHTML = accountsData.map(a =>
    `<button class="acct-btn${a.id===currentAid?' active':''}" data-aid="${a.id}">${a.id}</button>`
  ).join('');
  sw.querySelectorAll('.acct-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentAid = btn.dataset.aid;
      editingTargetId = null; editingDraft = null;
      sw.querySelectorAll('.acct-btn').forEach(b => b.classList.toggle('active', b === btn));
      loadAll();
    });
  });
}

let allocRows = [];
let allocSortKey = null;  // null=依配置順序，否則為 ALLOC_COLS 的 key
let allocSortDir = -1;    // -1=高→低(或 Z→A), 1=低→高(或 A→Z)
let currentCapital = null;
let currentAccountName = '';
let currentTargets = [];
let editingTargetId = null;   // 正在編輯中的 target id，null=無，'new'=新增列
let editingDraft = null;
let allocEditingTicker = null;   // 正在加倉/平倉編輯中的 ticker，null=無
let allocEditingMode = null;     // 'buy' | 'sell'
let allocSellBy = 'shares';      // 'shares' | 'amount'

const ALLOC_COLS = [
  {key: 'ticker', label: '標的'},
  {key: 'entry_date', label: '建倉日期'},
  {key: 'native', label: '現價'},
  {key: 'changePct', label: '當日%'},
  {key: 'target_pct', label: '目標%'},
  {key: 'actualPct', label: '實際%'},
  {key: 'drift', label: '偏離'},
  {key: 'shares', label: '股數'},
  {key: 'cost_twd', label: '成本'},
  {key: 'marketValue', label: '現值'},
  {key: 'pnl', label: '未實現損益'},
];

function allocCell(r, key){
  switch (key) {
    case 'ticker':
      return `<td class="name">${escHtml(r.ticker)}<span class="cat">${escHtml(r.category)}</span></td>`;
    case 'entry_date':
      return `<td>${r.entry_date ? escHtml(r.entry_date) : '—'}</td>`;
    case 'native':
      return `<td${r.error ? ` style="color:var(--faint)" title="報價失敗：${String(r.error).replace(/"/g, '&quot;')}"` : ''}>${r.error ? '報價失敗' : (r.native != null ? (r.market === 'US' ? '$' : '') + fmt(r.native, 2) : '—')}</td>`;
    case 'changePct':
      return `<td class="${r.changePct != null ? signClass(r.changePct) : ''}">${r.changePct != null ? sign(r.changePct) + fmt(r.changePct, 2) + '%' : '—'}</td>`;
    case 'target_pct':
      return `<td>${pct(r.target_pct)}</td>`;
    case 'actualPct':
      return `<td>${r.actualPct !== null ? pct(r.actualPct) : '—'}</td>`;
    case 'drift':
      return `<td class="${r.drift !== null ? signClass(r.drift) : ''}">${r.drift !== null ? sign(r.drift) + fmt(r.drift, 2) + 'pp' : '—'}</td>`;
    case 'shares':
      return `<td>${fmt(r.shares, r.shares % 1 === 0 ? 0 : 2)}</td>`;
    case 'cost_twd':
      return `<td>NT$${fmt(r.cost_twd)}</td>`;
    case 'marketValue':
      return `<td>NT$${fmt(r.marketValue)}</td>`;
    case 'pnl':
      return `<td class="${signClass(r.pnl)}">${sign(r.pnl)}NT$${fmt(r.pnl)}${r.cost_twd > 0 ? `<span style="font-size:11px;font-weight:400;opacity:.8">（${sign(100 * r.pnl / r.cost_twd)}${fmt(100 * r.pnl / r.cost_twd, 2)}%）</span>` : ''}</td>`;
  }
}

function allocSortValue(r, key){
  return key === 'ticker' ? r.ticker : r[key];
}

function compareAllocRows(a, b, key, dir){
  const va = allocSortValue(a, key), vb = allocSortValue(b, key);
  if (va == null && vb == null) return 0;
  if (va == null) return 1;
  if (vb == null) return -1;
  const natural = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
  return natural * dir;
}

function allocTotals(){
  const sum = (k) => allocRows.reduce((acc, r) => acc + (r[k] || 0), 0);
  const cost = sum('cost_twd'), mv = sum('marketValue'), pnl = mv - cost;
  const anyActualNull = allocRows.some(r => r.actualPct === null);
  return {
    target_pct: sum('target_pct'),
    actualPct: anyActualNull ? null : sum('actualPct'),
    cost_twd: cost, marketValue: mv, pnl,
  };
}

function allocActionsCell(r){
  if (allocEditingTicker === r.ticker && allocEditingMode === 'buy') {
    return `<td class="actions">
      <input type="number" class="alloc-buy-amount" placeholder="金額 NT$" style="width:100px">
      <button class="mini-btn save alloc-confirm-buy" data-ticker="${escAttr(r.ticker)}" data-market="${escAttr(r.market)}">確認</button>
      <button class="mini-btn alloc-cancel">取消</button>
    </td>`;
  }
  if (allocEditingTicker === r.ticker && allocEditingMode === 'sell') {
    return `<td class="actions">
      <select class="alloc-sell-by">
        <option value="shares"${allocSellBy === 'shares' ? ' selected' : ''}>股數</option>
        <option value="amount"${allocSellBy === 'amount' ? ' selected' : ''}>金額 NT$</option>
      </select>
      <input type="number" class="alloc-sell-value" placeholder="${allocSellBy === 'shares' ? '股數' : '金額 NT$'}" style="width:90px">
      <button class="mini-btn save alloc-confirm-sell" data-ticker="${escAttr(r.ticker)}" data-market="${escAttr(r.market)}">確認</button>
      <button class="mini-btn alloc-cancel">取消</button>
    </td>`;
  }
  return `<td class="actions">
    <button class="edit-ic alloc-add-btn" data-ticker="${escAttr(r.ticker)}" title="加倉">➕</button>
    <button class="edit-ic alloc-close-btn" data-ticker="${escAttr(r.ticker)}" title="平倉"${r.shares > 0 ? '' : ' disabled'}>➖</button>
  </td>`;
}

async function submitBuy(ticker, market, amount){
  const res = await fetch('/api/account/' + currentAid + '/buy', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ticker, market, amount_twd: amount}),
  });
  const data = await res.json();
  if (!res.ok) { alert('加倉失敗：' + data.error); return; }
  allocEditingTicker = null; allocEditingMode = null;
  applyAccountPayload(data);
  refreshLive();
}

async function submitSell(ticker, market, by, value){
  const body = {ticker, market};
  if (by === 'shares') body.shares = value; else body.amount_twd = value;
  const res = await fetch('/api/account/' + currentAid + '/sell', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) { alert('平倉失敗：' + data.error); return; }
  allocEditingTicker = null; allocEditingMode = null;
  applyAccountPayload(data);
  refreshLive();
}

function renderAllocTable(){
  const el = document.getElementById('allocTable');
  const rows = allocRows.slice();
  if (allocSortKey) rows.sort((a, b) => compareAllocRows(a, b, allocSortKey, allocSortDir));

  const headCells = ALLOC_COLS.map(c => {
    const arrow = allocSortKey === c.key ? (allocSortDir === -1 ? ' ▼' : ' ▲') : '';
    return `<th class="alloc-sort-h" data-key="${c.key}" style="cursor:pointer;user-select:none" title="點擊排序(高→低 / 低→高 / 原順序)">${c.label}${arrow}</th>`;
  }).join('') + '<th>操作</th>';

  const body = rows.map(r => `<tr>${ALLOC_COLS.map(c => allocCell(r, c.key)).join('')}${allocActionsCell(r)}</tr>`).join('');

  const t = allocTotals();
  const totalRow = `<tr class="total-row">
    <td class="name">總計</td>
    <td>—</td><td>—</td>
    <td>${pct(t.target_pct)}</td>
    <td>${t.actualPct !== null ? pct(t.actualPct) : '—'}</td>
    <td>—</td><td>—</td>
    <td>NT$${fmt(t.cost_twd)}</td>
    <td>NT$${fmt(t.marketValue)}</td>
    <td class="${signClass(t.pnl)}">${sign(t.pnl)}NT$${fmt(t.pnl)}</td>
    <td>—</td>
  </tr>`;

  el.innerHTML = `<table>
    <thead><tr>${headCells}</tr></thead>
    <tbody>${body}${totalRow}</tbody>
  </table>`;

  el.querySelectorAll('.alloc-sort-h').forEach(th => th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (allocSortKey !== key) { allocSortKey = key; allocSortDir = -1; }
    else if (allocSortDir === -1) { allocSortDir = 1; }
    else { allocSortKey = null; allocSortDir = -1; }
    renderAllocTable();
  }));

  el.querySelectorAll('.alloc-add-btn').forEach(btn => btn.addEventListener('click', () => {
    allocEditingTicker = btn.dataset.ticker; allocEditingMode = 'buy';
    renderAllocTable();
  }));
  el.querySelectorAll('.alloc-close-btn').forEach(btn => btn.addEventListener('click', () => {
    allocEditingTicker = btn.dataset.ticker; allocEditingMode = 'sell';
    renderAllocTable();
  }));
  el.querySelectorAll('.alloc-cancel').forEach(btn => btn.addEventListener('click', () => {
    allocEditingTicker = null; allocEditingMode = null;
    renderAllocTable();
  }));
  el.querySelectorAll('.alloc-sell-by').forEach(sel => sel.addEventListener('change', () => {
    allocSellBy = sel.value;
    renderAllocTable();
  }));
  el.querySelectorAll('.alloc-confirm-buy').forEach(btn => btn.addEventListener('click', () => {
    const tr = btn.closest('tr');
    const amount = parseFloat(tr.querySelector('.alloc-buy-amount').value);
    if (!amount || amount <= 0) { alert('請輸入金額'); return; }
    submitBuy(btn.dataset.ticker, btn.dataset.market, amount);
  }));
  el.querySelectorAll('.alloc-confirm-sell').forEach(btn => btn.addEventListener('click', () => {
    const tr = btn.closest('tr');
    const value = parseFloat(tr.querySelector('.alloc-sell-value').value);
    if (!value || value <= 0) { alert('請輸入' + (allocSellBy === 'shares' ? '股數' : '金額')); return; }
    submitSell(btn.dataset.ticker, btn.dataset.market, allocSellBy, value);
  }));
}

function applyAccountPayload(data){
  currentCapital = data.account.capital_twd;
  currentAccountName = data.account.name;
  currentTargets = data.targets;
  document.getElementById('acctName').textContent = currentAccountName + '（本金 NT$' + fmt(currentCapital) + '）';

  const latest = data.latest;
  document.getElementById('allocMeta').textContent = latest ? latest.date + ' 收盤' : '尚無快照';

  const holdingsByTicker = {};
  data.holdings.forEach(h => holdingsByTicker[h.ticker] = h);
  const total = latest ? latest.total_value_twd : null;

  // 總損益 = 總市值 − 本金
  const cap = data.account.capital_twd;
  const totalPnl = total !== null ? (total - cap) : null;
  const pnlEl = document.getElementById('acctPnl');
  if (totalPnl !== null) {
    const pnlPct = 100 * totalPnl / cap;
    pnlEl.innerHTML = `總損益 <span class="${signClass(totalPnl)}">${sign(totalPnl)}NT$${fmt(totalPnl)}（${sign(pnlPct)}${fmt(pnlPct, 2)}%）</span>`;
  } else {
    pnlEl.textContent = '';
  }
  const realizedPnl = data.account.realized_pnl_twd || 0;
  document.getElementById('acctRealizedPnl').innerHTML =
    `已實現損益 <span class="${signClass(realizedPnl)}">${sign(realizedPnl)}NT$${fmt(realizedPnl)}</span>`;

  const el = document.getElementById('allocTable');
  if (!data.targets.length) {
    el.innerHTML = '<div class="empty">無配置目標</div>';
  } else {
    allocRows = data.targets.map(t => {
      const h = holdingsByTicker[t.ticker] || {shares: 0, cost_twd: 0, market_value: 0, entry_date: null};
      const marketValue = h.market_value !== undefined ? h.market_value : h.cost_twd;
      const actualPct = total ? (100 * marketValue / total) : null;
      const drift = actualPct !== null ? (actualPct - t.target_pct) : null;
      const pnl = marketValue - h.cost_twd;
      return {ticker: t.ticker, market: t.market, category: t.category, target_pct: t.target_pct,
              actualPct, drift, shares: h.shares, cost_twd: h.cost_twd, marketValue, pnl,
              entry_date: h.entry_date};
    });
    renderAllocTable();
  }
  renderTargetMgmt();
}

async function loadAllocation(){
  const el = document.getElementById('allocTable');
  try {
    const res = await fetch('/api/account/' + currentAid);
    const data = await res.json();
    applyAccountPayload(data);
  } catch (e) {
    el.innerHTML = '<div class="err">載入失敗：' + e + '</div>';
  }
}

function escAttr(s){ return String(s).replace(/"/g, '&quot;'); }
function escHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function targetRowView(t){
  return `<tr data-id="${t.id}">
    <td class="name">${escHtml(t.ticker)}</td>
    <td>${escHtml(t.market)}</td>
    <td>${escHtml(t.category)}</td>
    <td>NT$${fmt(t.target_twd)}</td>
    <td>${t.build_method === 'lump' ? '一次' : 'DCA'}</td>
    <td class="actions">
      <button class="edit-ic edit-t" data-id="${t.id}" title="編輯">✏️</button>
      <button class="edit-ic del-t" data-id="${t.id}" title="刪除">🗑️</button>
    </td>
  </tr>`;
}

function targetRowEdit(t){
  const isNew = t.id === null;
  return `<tr data-id="${isNew ? 'new' : t.id}">
    <td><input type="text" class="f-ticker" value="${escAttr(t.ticker)}" placeholder="例如 AAPL"></td>
    <td><select class="f-market">
      <option value="TW"${t.market === 'TW' ? ' selected' : ''}>TW</option>
      <option value="US"${t.market === 'US' ? ' selected' : ''}>US</option>
    </select></td>
    <td><input type="text" class="f-category" value="${escAttr(t.category)}" placeholder="類別"></td>
    <td><input type="number" class="f-target_twd" value="${t.target_twd || ''}" placeholder="金額"></td>
    <td><select class="f-build_method">
      <option value="lump"${t.build_method === 'lump' ? ' selected' : ''}>一次</option>
      <option value="dca"${t.build_method === 'dca' ? ' selected' : ''}>DCA</option>
    </select></td>
    <td class="actions">
      <button class="mini-btn save save-t" data-id="${isNew ? 'new' : t.id}">儲存</button>
      <button class="mini-btn cancel-t">取消</button>
    </td>
  </tr>`;
}

function renderTargetMgmt(){
  const el = document.getElementById('targetMgmtTable');
  const rows = currentTargets.map(t =>
    editingTargetId === t.id ? targetRowEdit(t) : targetRowView(t)
  ).join('');
  const newRow = editingTargetId === 'new'
    ? targetRowEdit(editingDraft || {id: null, ticker: '', market: 'TW', category: '', target_twd: '', build_method: 'lump'})
    : '';
  if (!rows && !newRow) {
    el.innerHTML = '<div class="empty">無配置目標</div>';
    return;
  }
  el.innerHTML = `<table>
    <thead><tr><th>標的</th><th>市場</th><th>類別</th><th>目標金額</th><th>建倉方式</th><th>操作</th></tr></thead>
    <tbody>${rows}${newRow}</tbody>
  </table>`;

  el.querySelectorAll('.edit-t').forEach(btn => btn.addEventListener('click', () => {
    editingTargetId = Number(btn.dataset.id);
    renderTargetMgmt();
  }));
  el.querySelectorAll('.cancel-t').forEach(btn => btn.addEventListener('click', () => {
    editingTargetId = null; editingDraft = null;
    renderTargetMgmt();
  }));
  el.querySelectorAll('.del-t').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('確定刪除此標的？')) return;
    const res = await fetch(`/api/account/${currentAid}/target/${btn.dataset.id}`, {method: 'DELETE'});
    if (res.ok) { applyAccountPayload(await res.json()); loadAll(); }
    else alert('刪除失敗：' + (await res.json()).error);
  }));
  el.querySelectorAll('.save-t').forEach(btn => btn.addEventListener('click', async () => {
    const tr = btn.closest('tr');
    const payload = {
      ticker: tr.querySelector('.f-ticker').value,
      market: tr.querySelector('.f-market').value,
      category: tr.querySelector('.f-category').value,
      target_twd: tr.querySelector('.f-target_twd').value,
      build_method: tr.querySelector('.f-build_method').value,
    };
    const isNew = btn.dataset.id === 'new';
    const url = isNew ? `/api/account/${currentAid}/target` : `/api/account/${currentAid}/target/${btn.dataset.id}`;
    const res = await fetch(url, {
      method: isNew ? 'POST' : 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (res.ok) {
      editingTargetId = null; editingDraft = null;
      applyAccountPayload(data);
      loadAll();
    } else {
      alert('儲存失敗：' + data.error);
    }
  }));
}

document.getElementById('addTargetBtn').addEventListener('click', () => {
  editingTargetId = 'new';
  editingDraft = {id: null, ticker: '', market: 'TW', category: '', target_twd: '', build_method: 'lump'};
  renderTargetMgmt();
});

document.getElementById('editCapBtn').addEventListener('click', () => {
  const nameEl = document.getElementById('acctName');
  const cur = currentCapital;
  nameEl.innerHTML = `<span class="cap-edit">本金 NT$ <input type="number" id="capInput" value="${cur}"> <button class="mini-btn save" id="capSaveBtn">儲存</button> <button class="mini-btn" id="capCancelBtn">取消</button></span>`;
  document.getElementById('capCancelBtn').addEventListener('click', () => {
    nameEl.textContent = currentAccountName + '（本金 NT$' + fmt(currentCapital) + '）';
  });
  document.getElementById('capSaveBtn').addEventListener('click', async () => {
    const val = document.getElementById('capInput').value;
    const res = await fetch(`/api/account/${currentAid}/capital`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({capital_twd: val}),
    });
    const data = await res.json();
    if (res.ok) { applyAccountPayload(data); loadAll(); }
    else alert('儲存失敗：' + data.error);
  });
});

function drawNavSvg(points){
  const w = 640, h = 180, pad = 28;
  if (points.length < 2) {
    return '<div class="empty">快照筆數不足，無法繪製曲線</div>';
  }
  const values = points.map(p => p.total_value_twd);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const stepX = (w - pad * 2) / (points.length - 1);
  const coords = points.map((p, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((p.total_value_twd - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const path = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ' ' + c[1].toFixed(1)).join(' ');
  const areaPath = path + ` L${coords[coords.length-1][0].toFixed(1)} ${h-pad} L${coords[0][0].toFixed(1)} ${h-pad} Z`;
  const last = points[points.length - 1];
  const first = points[0];
  const changeUp = last.total_value_twd >= first.total_value_twd;
  const lineColor = changeUp ? '#c15f3c' : '#5f7346';
  const dots = coords.map((c, i) =>
    `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="${lineColor}"><title>${points[i].date}: NT$${Math.round(points[i].total_value_twd).toLocaleString()}</title></circle>`
  ).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">
    <defs>
      <linearGradient id="navFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${lineColor}" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="${lineColor}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaPath}" fill="url(#navFill)" stroke="none"/>
    <path d="${path}" fill="none" stroke="${lineColor}" stroke-width="2"/>
    ${dots}
  </svg>`;
}

async function loadNav(){
  const el = document.getElementById('navChart');
  try {
    const res = await fetch('/api/account/' + currentAid + '/nav');
    const points = await res.json();
    document.getElementById('navMeta').textContent = points.length ? points.length + ' 筆快照' : '';
    if (!points.length) {
      el.innerHTML = '<div class="empty">尚無淨值快照</div>';
      return;
    }
    el.innerHTML = drawNavSvg(points);
  } catch (e) {
    el.innerHTML = '<div class="err">載入失敗：' + e + '</div>';
  }
}

async function loadDca(){
  const el = document.getElementById('dcaBody');
  try {
    const res = await fetch('/api/account/' + currentAid);
    const data = await res.json();
    el.innerHTML = `
      <div class="dca-stat"><div class="n">6</div><div class="lbl">規劃批數</div></div>
      <div class="dca-note">此系統以一次性配置為主，DCA 批次進度需搭配交易紀錄追蹤（目前 API 未提供批次明細）。帳戶：<b>${data.account.name}</b>，本金 NT$${fmt(data.account.capital_twd)}。</div>
    `;
  } catch (e) {
    el.innerHTML = '<div class="err">載入失敗：' + e + '</div>';
  }
}

async function loadRebalance(){
  const el = document.getElementById('rebalBody');
  try {
    const res = await fetch('/api/account/' + currentAid + '/rebalance');
    const sigs = await res.json();
    if (!sigs.length) {
      el.innerHTML = '<div class="empty">目前無再平衡訊號</div>';
      return;
    }
    el.innerHTML = sigs.map(s => {
      if (s.type === 'drift') {
        return `<div class="reb-row">
          <span class="badge drift">偏離</span>
          <span class="txt"><b>${s.category}</b> 實際 ${pct(s.actual_pct)} vs 目標 ${pct(s.target_pct)}</span>
        </div>`;
      }
      if (s.type === 'satellite_take_profit') {
        return `<div class="reb-row">
          <span class="badge sat">獲利了結</span>
          <span class="txt">衛星部位市值 NT$${fmt(s.market_value)} 已超過目標 NT$${fmt(s.target)} 建議倍數，考慮減碼</span>
        </div>`;
      }
      return `<div class="reb-row"><span class="txt">${JSON.stringify(s)}</span></div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = '<div class="err">載入失敗：' + e + '</div>';
  }
}

function loadAll(){
  loadAllocation().then(refreshLive);
  loadNav();
  loadDca();
  loadRebalance();
}

async function refreshLive(){
  const btn = document.getElementById('refreshBtn');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '報價中…';
  try {
    const res = await fetch('/api/account/' + currentAid + '/live');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const byTicker = {};
    data.holdings.forEach(h => byTicker[h.ticker] = h);
    const total = data.total_value_twd;
    allocRows.forEach(r => {
      const h = byTicker[r.ticker];
      if (h) {
        r.market = h.market; r.native = h.last_native; r.changePct = h.change_pct; r.error = h.error;
        if (h.market_value != null) { r.marketValue = h.market_value; r.pnl = h.pnl; }
      }
      r.actualPct = total ? (100 * r.marketValue / total) : r.actualPct;
      r.drift = r.actualPct !== null ? (r.actualPct - r.target_pct) : r.drift;
    });
    renderAllocTable();
    const cap = (accountsData.find(a => a.id === currentAid) || {}).capital_twd;
    if (cap && total != null) {
      const totalPnl = total - cap, pnlPct = 100 * totalPnl / cap;
      document.getElementById('acctPnl').innerHTML =
        `總損益(即時) <span class="${signClass(totalPnl)}">${sign(totalPnl)}NT$${fmt(totalPnl)}（${sign(pnlPct)}${fmt(pnlPct, 2)}%）</span>`;
    }
    document.getElementById('allocMeta').textContent = '即時報價 · 匯率 ' + data.fx;
  } catch (e) {
    document.getElementById('allocMeta').textContent = '報價失敗：' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

document.getElementById('refreshBtn').addEventListener('click', refreshLive);
loadAccounts().then(loadAll);
</script>
