<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>陽台盆栽紀錄</title>
<style>
:root{
  --bg:#f7f2e4; --card:#fffdf7; --border:#ddd4bd;
  --fg:#141413; --muted:#73716a; --accent:#5f7346; --danger:#a5452a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,"PingFang TC","Segoe UI",sans-serif;
  font-size:14px; line-height:1.6; padding:24px;
}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{
  position:relative;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;box-shadow:0 2px 8px -4px rgba(0,0,0,.08);
}
.card img{width:100%;height:200px;object-fit:cover;display:block;cursor:zoom-in}
#lightbox{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;
  background:rgba(20,20,19,.86);cursor:zoom-out;
}
#lightbox[hidden]{display:none}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;
  border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.5)}
.thumb-ph{height:200px;display:grid;place-items:center;font-size:40px;
  background:linear-gradient(135deg,#efe9d8,#e4dcc6)}
.card-actions{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.card-actions button{
  width:28px;height:28px;padding:0;display:grid;place-items:center;line-height:1;
  font-size:13px;cursor:pointer;border:1px solid rgba(0,0,0,.08);border-radius:8px;
  background:rgba(255,255,255,.92);color:var(--fg);
}
.card-actions button:hover{background:#fff}
.card-actions .del{color:var(--danger)}
.card-body{padding:14px 16px}
.card h2{font-size:16px;margin-bottom:2px}
.cat{
  display:inline-block;font-size:11px;color:var(--accent);
  background:rgba(95,115,70,.12);padding:2px 8px;border-radius:6px;margin-bottom:8px;
}
.field{margin-top:8px}
.field .label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.field .val{font-size:13px}
.sec-title{font-size:15px;font-weight:700;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title:first-of-type{margin-top:8px}
.sec-title .n{font-size:12px;font-weight:400;color:var(--muted)}
.btn{
  font:inherit;font-size:13px;padding:8px 14px;cursor:pointer;
  border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--fg);
}
.btn:hover{background:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{font-size:12px;padding:3px 9px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:default}
.form-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.form-head h2{font-size:15px}
.name-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
#add-form{
  margin:14px 0 8px;padding:16px;background:var(--card);
  border:1px solid var(--border);border-radius:14px;
}
#add-form[hidden]{display:none}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.wide{grid-column:1/-1}
.fld label{font-size:11px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{
  font:inherit;font-size:13px;padding:8px 10px;background:#fff;color:var(--fg);
  border:1px solid var(--border);border-radius:8px;
}
.fld textarea{resize:vertical;min-height:56px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.err{color:var(--danger);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌿 陽台盆栽紀錄</h1>
  <div class="sub" id="meta">載入中…</div>

  <button class="btn primary" id="toggle-form">＋ 新增盆栽</button>

  <form id="add-form" hidden>
    <div class="form-head"><h2 id="form-title">新增盆栽</h2></div>
    <div class="form-grid">
      <div class="fld">
        <div class="name-row">
          <label for="f-name">名稱（必填）</label>
          <button type="button" class="btn small" id="ai-fill">🤖 AI 自動填入</button>
        </div>
        <input id="f-name" name="name" required maxlength="100" placeholder="例：薄荷">
      </div>
      <div class="fld">
        <label for="f-category">分類</label>
        <input id="f-category" name="category" maxlength="1000" placeholder="例：香草">
      </div>
      <div class="fld">
        <label for="f-water-type">澆水分類</label>
        <select id="f-water-type" name="water_type">
          <option value="dry">耐旱型（乾透澆透，忌積水）</option>
          <option value="moist">喜濕型（保持土壤濕潤）</option>
        </select>
      </div>
      <div class="fld">
        <label for="f-photo">照片（選填，10MB 內）</label>
        <input id="f-photo" name="photo" type="file"
               accept="image/jpeg,image/png,image/webp,image/gif">
      </div>
      <div class="fld wide">
        <label for="f-traits">特性</label>
        <textarea id="f-traits" name="traits" maxlength="1000"></textarea>
      </div>
      <div class="fld wide">
        <label for="f-light">日照</label>
        <textarea id="f-light" name="light" maxlength="1000"></textarea>
      </div>
      <div class="fld wide">
        <label for="f-water">澆水</label>
        <textarea id="f-water" name="water" maxlength="1000"></textarea>
      </div>
      <div class="fld wide">
        <label for="f-notes">備註</label>
        <textarea id="f-notes" name="notes" maxlength="1000"></textarea>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="cancel-form">取消</button>
      <button type="submit" class="btn primary">儲存</button>
    </div>
  </form>

  <div id="sections"></div>
</div>

<div id="lightbox" hidden><img id="lightbox-img" alt=""></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const sections = document.getElementById('sections');
const meta = document.getElementById('meta');
const form = document.getElementById('add-form');

let plants = [];
let editingId = null;

const GROUPS = [
  {key: 'dry', label: '🌵 耐旱型（乾透澆透，忌積水）'},
  {key: 'moist', label: '💧 喜濕型（保持土壤濕潤）'},
];

function cardHtml(p){
  const thumb = p.photo
    ? `<img src="${esc(p.photo)}" alt="${esc(p.name)}">`
    : `<div class="thumb-ph">🌱</div>`;
  const field = (label, val) => val
    ? `<div class="field"><div class="label">${label}</div><div class="val">${esc(val)}</div></div>`
    : '';
  return `
  <div class="card">
    <div class="card-actions">
      <button class="edit" data-edit="${esc(p.id)}" title="編輯">✏️</button>
      <button class="del" data-del="${esc(p.id)}" title="刪除">✕</button>
    </div>
    ${thumb}
    <div class="card-body">
      <h2>${esc(p.name)}</h2>
      ${p.category ? `<span class="cat">${esc(p.category)}</span>` : ''}
      ${field('特性', p.traits)}
      ${field('日照', p.light)}
      ${field('澆水', p.water)}
      ${field('備註', p.notes)}
    </div>
  </div>`;
}

function render(){
  meta.textContent = plants.length + ' 種植物';
  sections.innerHTML = GROUPS.map(g => {
    const items = plants.filter(p => p.water_type === g.key);
    return `
      <div class="sec-title">${g.label} <span class="n">（${items.length}）</span></div>
      <div class="grid">${items.map(cardHtml).join('')}</div>
    `;
  }).join('');
}

async function load(){
  try {
    const res = await fetch('/api/balcony-plants', {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    plants = await res.json();
    render();
  } catch (e) {
    meta.innerHTML = `<span class="err">載入失敗：${esc(e.message)}（請確認 command-center 是否在執行）</span>`;
    sections.innerHTML = '';
  }
}

const FORM_FIELDS = ['name', 'category', 'water_type', 'traits', 'light', 'water', 'notes'];

function setFormMode(plant){
  editingId = plant ? plant.id : null;
  document.getElementById('form-title').textContent = plant ? `編輯：${plant.name}` : '新增盆栽';
  form.querySelector('button[type=submit]').textContent = plant ? '更新' : '儲存';
}

function openForm(plant){
  form.reset();
  if (plant) {
    FORM_FIELDS.forEach(k => {
      const el = form.querySelector(`[name="${k}"]`);
      if (el) el.value = plant[k] || '';
    });
  }
  setFormMode(plant || null);
  form.hidden = false;
  document.getElementById('f-name').focus();
  form.scrollIntoView({behavior: 'smooth', block: 'center'});
}

function closeForm(){
  form.reset();
  form.hidden = true;
  setFormMode(null);
}

document.getElementById('toggle-form').addEventListener('click', () => {
  if (form.hidden) openForm(null);
  else closeForm();
});

document.getElementById('cancel-form').addEventListener('click', closeForm);

document.getElementById('ai-fill').addEventListener('click', async () => {
  const nameEl = document.getElementById('f-name');
  const name = nameEl.value.trim();
  if (!name) {
    alert('先輸入植物名稱，AI 才知道要查哪一種');
    nameEl.focus();
    return;
  }
  const btn = document.getElementById('ai-fill');
  btn.disabled = true;
  btn.textContent = '🤖 產生中…';
  try {
    const res = await fetch('/api/balcony-plants/suggest', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name}),
    });
    if (!res.ok) throw new Error(await apiError(res));
    const d = await res.json();
    form.querySelector('[name="water_type"]').value = d.water_type;
    let filled = 0;
    ['category', 'traits', 'light', 'water', 'notes'].forEach(k => {
      const el = form.querySelector(`[name="${k}"]`);
      if (!el || el.value.trim()) return;
      el.value = d[k] || '';
      filled++;
    });
    if (!filled) alert('文字欄位都已有內容，沒有覆蓋（澆水分類已依 AI 判斷更新）。');
  } catch (err) {
    alert('AI 填入失敗：' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🤖 AI 自動填入';
  }
});

async function apiError(res){
  const text = await res.text();
  try {
    const detail = JSON.parse(text).detail;
    if (typeof detail === 'string') return detail;
  } catch (_) {}
  return text || 'HTTP ' + res.status;
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const body = new FormData(form);
  const url = editingId
    ? '/api/balcony-plants/' + encodeURIComponent(editingId)
    : '/api/balcony-plants';
  try {
    const res = await fetch(url, {method: editingId ? 'PUT' : 'POST', body});
    if (!res.ok) throw new Error(await apiError(res));
    closeForm();
    await load();
  } catch (err) {
    alert((editingId ? '更新' : '新增') + '失敗：' + err.message);
  }
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

function closeLightbox(){
  lightbox.hidden = true;
  lightboxImg.removeAttribute('src');
}

sections.addEventListener('click', async e => {
  const img = e.target.closest('.card img');
  if (img) {
    lightboxImg.src = img.src;
    lightboxImg.alt = img.alt;
    lightbox.hidden = false;
    return;
  }
  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) {
    const plant = plants.find(p => p.id === editBtn.dataset.edit);
    if (plant) openForm(plant);
    return;
  }
  const btn = e.target.closest('[data-del]');
  if (!btn) return;
  const id = btn.dataset.del;
  const plant = plants.find(p => p.id === id);
  if (!confirm(`刪除「${plant ? plant.name : id}」？照片檔不會一起刪。`)) return;
  try {
    const res = await fetch('/api/balcony-plants/' + encodeURIComponent(id), {method: 'DELETE'});
    if (!res.ok) throw new Error(await apiError(res));
    await load();
  } catch (err) {
    alert('刪除失敗：' + err.message);
  }
});

lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !lightbox.hidden) closeLightbox();
});

load();
</script>
</body>
</html>
