<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>陽台盆栽紀錄</title>
<style>
:root{
  --bg:#f7f2e4; --card:#fffdf7; --border:#ddd4bd;
  --fg:#141413; --muted:#73716a; --accent:#5f7346;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,"PingFang TC","Segoe UI",sans-serif;
  font-size:14px; line-height:1.6; padding:24px;
}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;box-shadow:0 2px 8px -4px rgba(0,0,0,.08);
}
.card img{width:100%;height:200px;object-fit:cover;display:block}
.card-body{padding:14px 16px}
.card h2{font-size:16px;margin-bottom:2px}
.cat{
  display:inline-block;font-size:11px;color:var(--accent);
  background:rgba(95,115,70,.12);padding:2px 8px;border-radius:6px;margin-bottom:8px;
}
.field{margin-top:8px}
.field .label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.field .val{font-size:13px}
.sec-title{font-size:15px;font-weight:700;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title:first-of-type{margin-top:8px}
.sec-title .n{font-size:12px;font-weight:400;color:var(--muted)}
</style>
</head>

<div class="wrap">
  <h1>🌿 陽台盆栽紀錄</h1>
  <div class="sub" id="meta"></div>
  <div id="sections"></div>

<script>
const plants = JSON.parse(document.getElementById('plant-data').textContent);
document.getElementById('meta').textContent = plants.length + ' 種植物';

function cardHtml(p){
  return `
  <div class="card">
    <img src="${p.photo}" alt="${p.name}">
    <div class="card-body">
      <h2>${p.name}</h2>
      <span class="cat">${p.category}</span>
      <div class="field"><div class="label">特性</div><div class="val">${p.traits}</div></div>
      <div class="field"><div class="label">日照</div><div class="val">${p.light}</div></div>
      <div class="field"><div class="label">澆水</div><div class="val">${p.water}</div></div>
      <div class="field"><div class="label">備註</div><div class="val">${p.notes}</div></div>
    </div>
  </div>`;
}

const GROUPS = [
  {key: 'dry', label: '🌵 耐旱型（乾透澆透，忌積水）'},
  {key: 'moist', label: '💧 喜濕型（保持土壤濕潤）'},
];

const sections = document.getElementById('sections');
sections.innerHTML = GROUPS.map(g => {
  const items = plants.filter(p => p.water_type === g.key);
  return `
    <div class="sec-title">${g.label} <span class="n">（${items.length}）</span></div>
    <div class="grid">${items.map(cardHtml).join('')}</div>
  `;
}).join('');
</script>
</body>
</html>
