<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>持股明細</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0a0e14; --card: #111722; --border: #1e2a3a;
    --text: #e6e9ef; --text-dim: #7d8798; --green: #26c281; --red: #ff4757;
    --font-mono: "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang TC", sans-serif; margin: 0; padding: 1.5rem; }
  a.back { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; }
  h1 { font-size: 1.4rem; margin: 0.4rem 0 0.2rem; }
  .sub { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 1.2rem; }
  .layout { display: grid; grid-template-columns: 20rem 1fr; gap: 1.2rem; align-items: start; }
  @media (max-width: 60rem) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.45rem 0.5rem; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 500; font-size: 0.75rem; }
  td.num, th.num { text-align: right; font-family: var(--font-mono); }
  .up { color: var(--red); } .down { color: var(--green); }
  a.ticker-link { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--text-dim); }
  a.ticker-link:hover { color: #4a90d9; border-bottom-color: #4a90d9; }
  .badge { font-size: 0.65rem; border-radius: 4px; padding: 1px 5px; margin-left: 4px; }
  .badge.new { background: var(--green); color: #06210f; }
  .badge.exit { background: var(--red); color: #fff; }
  .exited-box { margin-top: 1rem; font-size: 0.8rem; color: var(--text-dim); }
  .empty { color: var(--text-dim); font-size: 0.8rem; padding: 2rem; text-align: center; }
  .entries-section { margin-top: 1.4rem; }
  .entries-section h2 { font-size: 1.05rem; margin: 0 0 0.3rem; }
  .entries-note { color: var(--text-dim); font-size: 0.78rem; margin-bottom: 0.9rem; max-width: 60rem; }
  .entries-note b { color: var(--text); }
  .entry-block { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 0.8rem; overflow: hidden; }
  .entry-head { display: flex; align-items: baseline; gap: 0.7rem; padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--border); }
  .entry-head .sym { font-weight: 700; font-size: 1rem; }
  .entry-head .weight { font-family: var(--font-mono); font-size: 0.75rem; color: #f5a623; background: rgba(245,166,35,0.12); padding: 1px 8px; border-radius: 10px; }
  .uncertain-flag { color: #f5a623; font-size: 0.7rem; margin-left: 3px; cursor: help; }
</style>
</head>
<body>
<a class="back" href="/">← 回總覽</a>
<h1 id="title">載入中...</h1>
<div class="sub" id="sub"></div>
<div class="layout">
  <div class="card"><canvas id="sectorChart"></canvas></div>
  <div class="card">
    <table>
      <thead><tr>
        <th>Ticker</th><th>族群</th>
        <th class="num">股數</th><th class="num">股數變動</th><th class="num">變動%</th>
        <th class="num">占比</th><th>資料日期</th><th>近兩年持倉走勢</th>
      </tr></thead>
      <tbody id="holdingsBody"><tr><td colspan="8" class="empty">載入中...</td></tr></tbody>
    </table>
    <div class="exited-box" id="exitedBox"></div>
  </div>
</div>

<div class="entries-section" id="entriesSection" style="display:none">
  <h2>建倉時間點與隱含均價</h2>
  <div class="entries-note">
    13F 只揭露季末持股股數與市值，不揭露實際成交價，<b>隱含均價</b>是「季末申報市值 ÷ 股數」的推算，非真實成本均價。
    <b>首見季度</b>指該大老第一次出現在我方追蹤資料庫的季度——標 <span class="uncertain-flag">‡</span> 代表我方歷史資料剛好從那一季開始，更早是否已持有無法確認。
  </div>
  <div id="entriesBlocks"></div>
</div>

<script>
const holderId = {{ holder_id | tojson }};

async function load() {
  const res = await fetch(`/api/holder/${holderId}`);
  if (!res.ok) { document.getElementById('title').textContent = '查無此人物'; return; }
  const d = await res.json();

  document.getElementById('title').textContent = `${d.name_zh}（${d.name}）`;
  document.getElementById('sub').textContent =
    `資料來源：${d.source} ｜ 資料期別：${d.latest_period || '—'}` +
    (d.prev_period ? ` ｜ 對比上期：${d.prev_period}` : '') +
    (d.updated_at ? ` ｜ 更新於 ${d.updated_at.slice(0,16).replace('T',' ')}` : '') +
    ` ｜ 顯示前10大（共 ${d.total_holding_count ?? d.holdings.length} 檔）`;

  const fmtShares = n => (n === null || n === undefined) ? '—' : Math.round(n).toLocaleString();
  const fmtPct = (n, withSign) => (n === null || n === undefined) ? '—'
    : `${withSign && n >= 0 ? '+' : ''}${n}%`;
  const yahooUrl = ticker => `https://finance.yahoo.com/quote/${encodeURIComponent(ticker.replace(/\//g, '-'))}`;
  const tickerLink = ticker => `<a class="ticker-link" href="${yahooUrl(ticker)}" target="_blank" rel="noopener">${ticker}</a>`;

  const body = document.getElementById('holdingsBody');
  if (!d.holdings.length) {
    body.innerHTML = '<tr><td colspan="8" class="empty">尚無持股資料</td></tr>';
  } else {
    body.innerHTML = d.holdings.map(h => {
      const newBadge = h.status === 'new' ? '<span class="badge new">新進</span>' : '';
      const sharesChangeTxt = h.shares_change === null ? '—'
        : `<span class="${h.shares_change >= 0 ? 'up' : 'down'}">${h.shares_change >= 0 ? '+' : ''}${fmtShares(h.shares_change)}</span>`;
      const pctChangeTxt = h.shares_change_pct === null ? '—'
        : `<span class="${h.shares_change_pct >= 0 ? 'up' : 'down'}">${fmtPct(h.shares_change_pct, true)}</span>`;
      const canvasId = `spark-${h.ticker.replace(/[^A-Za-z0-9]/g, '_')}`;
      return `<tr>
        <td>${tickerLink(h.ticker)}${newBadge}</td>
        <td>${h.sector}</td>
        <td class="num">${fmtShares(h.shares)}</td>
        <td class="num">${sharesChangeTxt}</td>
        <td class="num">${pctChangeTxt}</td>
        <td class="num">${h.weight_pct}%</td>
        <td>${h.filed_date || '—'}</td>
        <td><canvas id="${canvasId}" width="130" height="34"></canvas></td>
      </tr>`;
    }).join('');

    // 每檔標的各自抓近兩年歷史，畫占比走勢小圖（sparkline）
    d.holdings.forEach(h => {
      const canvasId = `spark-${h.ticker.replace(/[^A-Za-z0-9]/g, '_')}`;
      const canvas = document.getElementById(canvasId);
      fetch(`/api/holder/${holderId}/history/${encodeURIComponent(h.ticker)}`)
        .then(r => r.json())
        .then(res => {
          const hist = res.history || [];
          if (hist.length < 2) {
            canvas.replaceWith(document.createTextNode(hist.length === 1 ? '僅1期資料' : '無資料'));
            return;
          }
          const rising = hist[hist.length - 1].weight_pct >= hist[0].weight_pct;
          new Chart(canvas, {
            type: 'line',
            data: {
              labels: hist.map(p => p.period),
              datasets: [{
                data: hist.map(p => p.weight_pct),
                borderColor: rising ? '#ff4757' : '#26c281',
                backgroundColor: 'transparent',
                borderWidth: 1.5, pointRadius: 0, tension: 0.25,
              }],
            },
            options: {
              responsive: false, animation: false,
              plugins: { legend: { display: false }, tooltip: { enabled: true,
                callbacks: { title: (items) => hist[items[0].dataIndex].period,
                             label: (item) => `占比 ${item.formattedValue}%` } } },
              scales: { x: { display: false }, y: { display: false } },
              elements: { point: { hoverRadius: 3 } },
            },
          });
        })
        .catch(() => { canvas.replaceWith(document.createTextNode('—')); });
    });
  }

  if (d.exited && d.exited.length) {
    const rows = d.exited.map(e =>
      `${tickerLink(e.ticker)}（原持股 ${fmtShares(e.shares)} 股，占比 ${e.weight_pct}%，資料日期 ${e.filed_date || '—'}）`
    ).join('、');
    document.getElementById('exitedBox').innerHTML =
      `本期已出清（相較上期 ${d.prev_period || '—'}）：${rows}`;
  }

  if (holderId === 'steven_zhou') {
    loadEntries();
  }

  if (d.sector_breakdown.length) {
    new Chart(document.getElementById('sectorChart'), {
      type: 'doughnut',
      data: {
        labels: d.sector_breakdown.map(s => s.sector),
        datasets: [{
          data: d.sector_breakdown.map(s => s.weight_pct),
          backgroundColor: ['#26c281','#ff4757','#4a90d9','#a37bff','#f5a623','#50e3c2','#e35a8f','#7d8798','#c9a227','#5f9ea0','#d16ba5','#8fb339'],
          borderColor: '#0a0e14', borderWidth: 2,
        }]
      },
      options: {
        plugins: { legend: { position: 'bottom', labels: { color: '#e6e9ef', font: { size: 11 } } } }
      }
    });
  }
}
async function loadEntries() {
  const res = await fetch(`/api/holder/steven_zhou/entries`);
  if (!res.ok) return;
  const d = await res.json();
  if (!d.ok || !d.blocks.length) return;

  const fmtShares = n => (n === null || n === undefined) ? '—' : Math.round(n).toLocaleString();
  const fmtValue = n => {
    if (n === null || n === undefined) return '—';
    if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
    return '$' + Math.round(n).toLocaleString();
  };
  const fmtPrice = n => (n === null || n === undefined) ? '—' : '$' + n.toFixed(2);
  const yahooUrl = ticker => `https://finance.yahoo.com/quote/${encodeURIComponent(ticker.replace(/\//g, '-'))}`;

  document.getElementById('entriesBlocks').innerHTML = d.blocks.map(b => `
    <div class="entry-block">
      <div class="entry-head">
        <span class="sym"><a class="ticker-link" href="${yahooUrl(b.ticker)}" target="_blank" rel="noopener">${b.ticker}</a></span>
        <span class="weight">交集權重 ${b.weight_pct}%</span>
      </div>
      <table>
        <thead><tr>
          <th>大老</th><th>首見申報季度</th><th class="num">股數</th><th class="num">當季市值</th><th class="num">隱含均價</th>
        </tr></thead>
        <tbody>
          ${b.entries.map(e => `<tr>
            <td>${e.holder_zh}</td>
            <td>${e.first_period}${e.uncertain ? '<span class="uncertain-flag" title="我方追蹤資料剛好從此季開始，更早是否已持有無法確認">‡</span>' : ''}</td>
            <td class="num">${fmtShares(e.shares)}</td>
            <td class="num">${fmtValue(e.value_usd)}</td>
            <td class="num">${fmtPrice(e.implied_price)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
  document.getElementById('entriesSection').style.display = 'block';
}

load();
</script>
</body>
</html>
