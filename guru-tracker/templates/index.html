<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>投資大老持股追蹤</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0a0e14; --card: #111722; --border: #1e2a3a;
    --text: #e6e9ef; --text-dim: #7d8798; --green: #26c281; --red: #ff4757;
    --font-mono: "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang TC", sans-serif; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1.3rem; margin: 0 0 0.3rem; }
  .sub { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 1.2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: 1rem; }
  a.card {
    display: block; border: 1px solid var(--border); border-left: 4px solid var(--accent, var(--border));
    border-radius: 10px; padding: 1rem 1.1rem; text-decoration: none; color: var(--text);
    transition: border-color 0.15s, transform 0.15s;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent, var(--border)) 16%, var(--card)), var(--card) 65%);
  }
  a.card:hover { border-color: #3a4a5f; border-left-color: var(--accent, #3a4a5f); transform: translateY(-1px); }
  .card.virtual { border-left-width: 4px; }
  .name { font-size: 1.05rem; font-weight: 600; }
  .name-en { color: var(--text-dim); font-size: 0.75rem; margin-left: 0.3rem; }
  .meta { color: var(--text-dim); font-size: 0.75rem; font-family: var(--font-mono); margin: 0.3rem 0 0.6rem; }
  .top3 { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip { background: rgba(255,255,255,0.06); border-radius: 5px; padding: 2px 7px; font-size: 0.78rem; font-family: var(--font-mono); }
  .empty { color: var(--text-dim); font-size: 0.8rem; padding: 2rem; text-align: center; }
  .card-spark { margin-top: 0.6rem; }
  .card-spark-label { font-size: 0.68rem; color: var(--text-dim); margin-bottom: 2px; }
  .position-card { border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 1.2rem; background: var(--card); }
  .position-card h2 { font-size: 1rem; margin: 0 0 0.2rem; }
  .position-note { color: var(--text-dim); font-size: 0.78rem; margin-bottom: 0.8rem; max-width: 55rem; }
  .position-note b { color: var(--text); }
</style>
</head>
<body>
<h1>📊 投資大老持股追蹤</h1>
<div class="sub">13F 申報資料落後（季度結束後最長45天+），木頭姐(ARK)為每日資料。點卡片看詳細持股與族群分類。</div>

<div class="position-card">
  <h2>持倉滿倉度（季線，2025-Q1起）</h2>
  <div class="position-note">
    每人以自己「歷史總持股市值最高的那一季」為滿倉基準（100%），之後每一季的總市值換算成該基準的百分比——
    <b>越接近100%代表越重倉、越低代表相對減碼</b>。這是總市值變化，會混雜「實際加減碼」與「持股本身漲跌」兩種效果，不是單純的股數增減。
    13F 只有季資料，無法畫週線；木頭姐(ARK)是逐日資料與此季度軸不同步，未納入比較；格里芬、阿申布倫納目前只有一季資料，僅顯示單點。
  </div>
  <canvas id="positionChart" height="90"></canvas>
</div>

<div id="grid" class="grid"><div class="empty">載入中...</div></div>

<script>
// 每位人物固定一種底色，方便一眼區分卡片
const ACCENTS = {
  buffett:        '#4a90d9',
  cathie_wood:    '#ff6b6b',
  dalio:          '#f5a623',
  ackman:         '#26c281',
  druckenmiller:  '#ff9f43',
  soros:          '#50e3c2',
  aschenbrenner:  '#e35a8f',
  griffin:        '#c9a227',
  tepper:         '#5f9ea0',
  klarman:        '#8fb339',
  li_lu:          '#d16ba5',
  gates:          '#6c8ee0',
  steven_zhou:    '#a37bff',
};

let POSITION_DATA = null;

// 卡片小線圖用：在每個資料點上方標出倉位百分比
const POINT_LABEL_PLUGIN = {
  id: 'pointLabels',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    const meta = chart.getDatasetMeta(0);
    const data = chart.data.datasets[0].data;
    ctx.save();
    ctx.font = '9px -apple-system, sans-serif';
    ctx.fillStyle = '#a9b2c0';
    ctx.textAlign = 'center';
    meta.data.forEach((point, i) => {
      const v = data[i];
      if (v === null || v === undefined) return;
      ctx.fillText(`${Math.round(v)}%`, point.x, point.y - 7);
    });
    ctx.restore();
  },
};

async function load() {
  const res = await fetch('/api/holders');
  const data = await res.json();
  const all = [...data.holders, ...data.steven_zhou];
  const grid = document.getElementById('grid');
  if (!all.length) { grid.innerHTML = '<div class="empty">尚無資料，updater 可能還沒跑過</div>'; return; }
  const fmtAssets = v => {
    if (!v) return null;
    if (v >= 1e9) return `$${(v/1e9).toFixed(1)}B`;
    if (v >= 1e6) return `$${(v/1e6).toFixed(0)}M`;
    return `$${v.toLocaleString()}`;
  };

  const posLineById = new Map((POSITION_DATA?.lines || []).map(l => [l.id, l]));
  const arkLine = POSITION_DATA?.ark_line;

  grid.innerHTML = all.map(h => {
    const posLine = posLineById.get(h.id);
    let spark = '';
    if (h.id === 'cathie_wood' && arkLine) {
      const pct = arkLine.points[arkLine.points.length - 1]?.pct_of_peak;
      spark = `<div class="card-spark"><div class="card-spark-label">持倉滿倉度 ${pct != null ? Math.round(pct) + '%' : ''}（日線，歷史峰值基準）</div><canvas id="spark-cathie_wood" width="260" height="62"></canvas></div>`;
    } else if (posLine && !posLine.single_point) {
      spark = `<div class="card-spark"><div class="card-spark-label">持倉滿倉度</div><canvas id="spark-${h.id}" width="260" height="62"></canvas></div>`;
    }
    const fullnessInfo = h.fullness_pct != null ? ` · 滿倉 ${h.fullness_pct}%` : '';
    return `
    <a class="card ${h.type === 'virtual' ? 'virtual' : ''}" href="/holder/${h.id}" style="--accent:${ACCENTS[h.id] || '#7d8798'}">
      <div class="name">${h.name_zh}<span class="name-en">${h.name}</span></div>
      <div class="meta">${h.latest_period ? '資料期別 ' + h.latest_period : '無資料'} · 共 ${h.holding_count} 檔${fmtAssets(h.total_value_usd) ? ' · 總資產 ' + fmtAssets(h.total_value_usd) : ''}${fullnessInfo}</div>
      <div class="top3">
        ${h.top3.map(t => `<span class="chip">${t.ticker} ${t.weight_pct}%</span>`).join('') || '<span class="chip">—</span>'}
      </div>
      ${spark}
    </a>
  `;
  }).join('');

  if (POSITION_DATA) { drawCardSparklines(); drawArkSparkline(); }
}

function drawArkSparkline() {
  const arkLine = POSITION_DATA?.ark_line;
  if (!arkLine) return;
  const canvas = document.getElementById('spark-cathie_wood');
  if (!canvas) return;
  const labels = arkLine.points.map(p => p.date.substring(5));
  const data = arkLine.points.map(p => p.pct_of_peak);
  const color = ACCENTS['cathie_wood'] || '#ff6b6b';
  new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: [{
      data, borderColor: color, backgroundColor: 'transparent',
      borderWidth: 1.6, pointRadius: 0, pointHoverRadius: 3, spanGaps: true, tension: 0.25,
    }] },
    options: {
      responsive: false, animation: false, layout: { padding: { top: 14, left: 16, right: 16 } },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          title: items => arkLine.points[items[0].dataIndex].date,
          label: ctx => `${ctx.formattedValue}% of peak`,
        } },
      },
      scales: { x: { display: false }, y: { display: false, min: 40, max: 105 } },
    },
    plugins: [POINT_LABEL_PLUGIN],
  });
}

function drawCardSparklines() {
  const d = POSITION_DATA;
  if (!d.ok || !d.periods.length) return;
  const idx = new Map(d.periods.map((p, i) => [p, i]));
  d.lines.forEach(line => {
    if (line.single_point) return;
    const canvas = document.getElementById(`spark-${line.id}`);
    if (!canvas) return;
    const arr = new Array(d.periods.length).fill(null);
    line.points.forEach(pt => { arr[idx.get(pt.period)] = pt.pct_of_peak; });
    const color = ACCENTS[line.id] || '#7d8798';
    new Chart(canvas, {
      type: 'line',
      data: { labels: d.periods, datasets: [{
        data: arr, borderColor: color, backgroundColor: 'transparent',
        borderWidth: 1.6, pointRadius: 2.5, pointBackgroundColor: color, pointHoverRadius: 4, spanGaps: true, tension: 0.25,
      }] },
      options: {
        responsive: false, animation: false, layout: { padding: { top: 14, left: 16, right: 16 } },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: {
            title: items => d.periods[items[0].dataIndex],
            label: ctx => `${ctx.formattedValue}% of peak`,
          } },
        },
        scales: { x: { display: false }, y: { display: false, min: 40, max: 105 } },
        elements: { point: { hoverRadius: 3 } },
      },
      plugins: [POINT_LABEL_PLUGIN],
    });
  });
}

async function loadPositionChart() {
  const res = await fetch('/api/position-history');
  const d = await res.json();
  POSITION_DATA = d;
  if (!d.ok || !d.periods.length) return;

  const idx = new Map(d.periods.map((p, i) => [p, i]));
  const datasets = d.lines.map(line => {
    const arr = new Array(d.periods.length).fill(null);
    line.points.forEach(pt => { arr[idx.get(pt.period)] = pt.pct_of_peak; });
    return {
      label: line.name_zh,
      data: arr,
      borderColor: ACCENTS[line.id] || '#7d8798',
      backgroundColor: 'transparent',
      borderWidth: line.single_point ? 0 : 1.8,
      pointRadius: line.single_point ? 4 : 2,
      pointHoverRadius: 5,
      spanGaps: true,
      tension: 0.2,
    };
  });

  new Chart(document.getElementById('positionChart'), {
    type: 'line',
    data: { labels: d.periods, datasets },
    options: {
      responsive: true,
      interaction: { mode: 'nearest', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { color: '#e6e9ef', font: { size: 11 }, boxWidth: 10 } },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}：${ctx.formattedValue}% of peak` } },
      },
      scales: {
        x: { ticks: { color: '#7d8798' }, grid: { color: '#1e2a3a' } },
        y: { ticks: { color: '#7d8798', callback: v => v + '%' }, grid: { color: '#1e2a3a' }, min: 40, max: 105 },
      },
    },
  });

  drawCardSparklines();
}

(async () => {
  await loadPositionChart();
  await load();
})();
</script>
</body>
</html>
